<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F3F4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dreierlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;900&display=swap">
<style>
  /* Layout: Spieltisch. One screen per game phase; the card or the timer is the hero, every action sits in the thumb zone.
     Color 60/30/10: neutral table / ink / token-yellow accent. Categories (Erklären, Zeichnen, Pantomime) and teams carry their own colours.
     Type: one family (Nunito), 2 weights, 4 sizes. Spacing on the 8-point grid. */
  :root {
    --bg: #F3F4F9;
    --surface: #FFFFFF;
    --ink: #1B1E30;
    --ink-2: rgb(27 30 48 / .8);
    --ink-3: rgb(27 30 48 / .62);
    --line: rgb(27 30 48 / .1);
    --line-strong: rgb(27 30 48 / .16);
    --track: rgb(27 30 48 / .07);
    --accent: #FFC22E;
    --accent-edge: #DDA000;
    --accent-ink: #1B1E30;
    --accent-soft: rgb(255 194 46 / .16);
    --focus: #2A5BD7;
    --ok: #13A06C; --ok-edge: #0C7A51;
    --warn: #E98500; --crit: #E3402F;
    --on-color: #FFFFFF; --on-mode: #FFFFFF;
    --m-erklaeren: #D9560C; --m-zeichnen: #1E7BD0; --m-pantomime: #C63B7F;
    --blue: #3550F2; --red: #E5484D; --green: #12A37E; --yellow: #D99A00; --violet: #8B4DFF; --cyan: #0A9CBF;
    --shadow-1: 0 1px 2px rgb(27 30 48 / .06), 0 6px 16px rgb(27 30 48 / .06);
    --shadow-2: 0 2px 4px rgb(27 30 48 / .05), 0 16px 40px rgb(27 30 48 / .14);
    --font: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-s: 13px; --fs-m: 16px; --fs-l: 24px; --fs-xl: clamp(44px, 13vw, 64px);
    --w-1: 600; --w-2: 900;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
    --r-card: 24px; --r-ctl: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10121C; --surface: #1B1E2D; --ink: #F1F2F8;
      --ink-2: rgb(241 242 248 / .8); --ink-3: rgb(241 242 248 / .62);
      --line: rgb(241 242 248 / .1); --line-strong: rgb(241 242 248 / .16); --track: rgb(241 242 248 / .08);
      --accent: #FFC93F; --accent-edge: #C08F00; --accent-ink: #1B1E30; --accent-soft: rgb(255 201 63 / .14);
      --focus: #8FB0FF; --ok: #2CBF87; --ok-edge: #1B8F63; --warn: #FFA62B; --crit: #FF5C4F;
      --on-color: #10121C; --on-mode: #10121C;
      --m-erklaeren: #FF9152; --m-zeichnen: #5AABF2; --m-pantomime: #F06BAE;
      --blue: #7C8DFF; --red: #FF6B70; --green: #3CCB9F; --yellow: #FFC53D; --violet: #B08CFF; --cyan: #3CC7E6;
      --shadow-1: 0 1px 2px rgb(0 0 0 / .3), 0 6px 16px rgb(0 0 0 / .25);
      --shadow-2: 0 2px 4px rgb(0 0 0 / .3), 0 16px 40px rgb(0 0 0 / .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10121C; --surface: #1B1E2D; --ink: #F1F2F8;
    --ink-2: rgb(241 242 248 / .8); --ink-3: rgb(241 242 248 / .62);
    --line: rgb(241 242 248 / .1); --line-strong: rgb(241 242 248 / .16); --track: rgb(241 242 248 / .08);
    --accent: #FFC93F; --accent-edge: #C08F00; --accent-ink: #1B1E30; --accent-soft: rgb(255 201 63 / .14);
    --focus: #8FB0FF; --ok: #2CBF87; --ok-edge: #1B8F63; --warn: #FFA62B; --crit: #FF5C4F;
    --on-color: #10121C; --on-mode: #10121C;
    --m-erklaeren: #FF9152; --m-zeichnen: #5AABF2; --m-pantomime: #F06BAE;
    --blue: #7C8DFF; --red: #FF6B70; --green: #3CCB9F; --yellow: #FFC53D; --violet: #B08CFF; --cyan: #3CC7E6;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .3), 0 6px 16px rgb(0 0 0 / .25);
    --shadow-2: 0 2px 4px rgb(0 0 0 / .3), 0 16px 40px rgb(0 0 0 / .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: var(--fs-m);
    font-weight: var(--w-1);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; font-weight: inherit; }
  b, strong { font-weight: var(--w-2); }
  svg { display: block; }

  .t-blue { --team: var(--blue); } .t-red { --team: var(--red); } .t-green { --team: var(--green); }
  .t-yellow { --team: var(--yellow); } .t-violet { --team: var(--violet); } .t-cyan { --team: var(--cyan); }
  .m-erklaeren { --mc: var(--m-erklaeren); } .m-zeichnen { --mc: var(--m-zeichnen); } .m-pantomime { --mc: var(--m-pantomime); }

  .screen {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column; gap: var(--s-5);
    padding-block: var(--s-4) var(--s-5);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .phase-play { height: 100%; min-height: 560px; gap: var(--s-4); }
  .grow { flex: 1; }
  .label { font-size: var(--fs-s); font-weight: var(--w-2); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .group { display: grid; gap: var(--s-3); }
  .label-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
  .hint-text { font-size: var(--fs-s); color: var(--ink-3); text-wrap: pretty; }

  /* ---------- Top bar */
  .bar { display: flex; align-items: center; gap: var(--s-2); }
  .brand { font-weight: var(--w-2); font-size: var(--fs-m); letter-spacing: -0.01em; }
  .brand span, .title span { background: linear-gradient(transparent 50%, var(--accent) 50%, var(--accent) 82%, transparent 82%); }
  .bar-sub { flex: 1; min-width: 0; color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    border: 0; border-radius: 14px;
    background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-1); cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .pill-btn {
    height: 44px; padding: 0 var(--s-4);
    display: inline-flex; align-items: center; gap: var(--s-2);
    border: 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-1);
    font-size: var(--fs-s); font-weight: var(--w-2); cursor: pointer;
  }
  .pill-btn svg { width: 20px; height: 20px; }

  /* ---------- Buttons: chunky, pressable game tokens */
  .btn {
    --edge: var(--line-strong); --hl: 0 0 #0000;
    min-height: 56px; padding: 0 var(--s-5); margin-bottom: var(--s-1);
    border: 0; border-radius: var(--r-ctl);
    font-size: var(--fs-m); font-weight: var(--w-2);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
    cursor: pointer;
    box-shadow: var(--hl), 0 4px 0 var(--edge);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: var(--hl), 0 1px 0 var(--edge); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn[disabled] { opacity: .4; cursor: default; transform: none; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); --edge: var(--accent-edge); --hl: inset 0 1px 0 rgb(255 255 255 / .55); }
  .btn-ok { background: var(--ok); color: var(--on-color); --edge: var(--ok-edge); --hl: inset 0 1px 0 rgb(255 255 255 / .3); }
  .btn-team { background: var(--team); color: var(--on-color); --edge: color-mix(in srgb, var(--team) 70%, #000); --hl: inset 0 1px 0 rgb(255 255 255 / .3); }
  .btn-secondary { background: var(--surface); color: var(--ink); --hl: inset 0 0 0 1px var(--line); }
  .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: grid; grid-template-columns: 1fr 1.5fr; gap: var(--s-3); }
  .row-even { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }

  /* ---------- Sticky action area in the thumb zone */
  .cta {
    position: sticky; bottom: 0; z-index: 2;
    display: grid; gap: var(--s-2);
    margin-bottom: calc(-1 * var(--s-5));
    padding-block: var(--s-5);
    background: linear-gradient(to bottom, transparent, var(--bg) var(--s-5));
  }
  .handoff-hint { display: flex; align-items: center; justify-content: center; gap: var(--s-2); color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-2); }
  .handoff-hint svg { width: 18px; height: 18px; }

  /* ---------- Setup */
  .hero { display: grid; justify-items: center; text-align: center; gap: var(--s-3); }
  .fan { position: relative; width: 280px; max-width: 100%; height: 124px; }
  .fan-card {
    position: absolute; top: var(--s-3); left: 50%;
    width: 84px; height: 104px; margin-left: -42px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-2);
    border-radius: var(--r-ctl); border-top: 6px solid var(--mc);
    background: var(--surface); box-shadow: var(--shadow-2);
    font-size: var(--fs-s); font-weight: var(--w-2); color: var(--ink-2);
  }
  .fan-card span { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--mc) 16%, var(--surface)); color: var(--mc); }
  .fan-card svg { width: 24px; height: 24px; }
  .fan-card:nth-child(1) { transform: translate(-90px, 10px) rotate(-10deg); animation: fanL .6s cubic-bezier(.2,.8,.2,1); }
  .fan-card:nth-child(2) { z-index: 1; }
  .fan-card:nth-child(3) { transform: translate(90px, 10px) rotate(10deg); animation: fanR .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes fanL { from { transform: none; } }
  @keyframes fanR { from { transform: none; } }
  .title { font-size: var(--fs-xl); font-weight: var(--w-2); line-height: 1; letter-spacing: -0.03em; }
  .lede { color: var(--ink-2); max-width: 32ch; text-wrap: balance; }

  .teams { display: grid; gap: var(--s-2); }
  .team-row {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-1) var(--s-1) var(--s-1) var(--s-4);
    border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--shadow-1);
  }
  .team-row:focus-within { box-shadow: var(--shadow-1), inset 0 0 0 2px var(--team); }
  .team-row > svg { width: 24px; height: 24px; color: var(--team); flex: none; }
  .team-row input { flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: var(--ink); font-weight: var(--w-2); outline: none; }
  .team-row .icon-btn { background: transparent; box-shadow: none; color: var(--ink-3); }
  .add {
    min-height: 56px; display: flex; align-items: center; justify-content: center; gap: var(--s-2);
    border: 2px dashed var(--line-strong); border-radius: var(--r-ctl); background: transparent;
    color: var(--ink-3); font-weight: var(--w-2); cursor: pointer;
  }
  .add svg { width: 20px; height: 20px; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .opt {
    display: grid; align-content: start; gap: var(--s-1);
    padding: var(--s-4); border: 0; border-radius: var(--r-ctl);
    background: var(--surface); box-shadow: var(--shadow-1);
    text-align: left; cursor: pointer;
  }
  .opt svg { width: 24px; height: 24px; color: var(--ink-3); margin-bottom: var(--s-1); }
  .opt small { font-size: var(--fs-s); color: var(--ink-3); line-height: 1.35; }
  .opt[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); box-shadow: var(--shadow-1), inset 0 0 0 2px var(--accent-edge); }
  .opt[aria-checked="true"] svg { color: var(--ink); }

  .stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: var(--s-2); align-items: center; }
  .stepper .icon-btn { width: 56px; height: 56px; font-size: var(--fs-l); font-weight: var(--w-2); }
  .step-val {
    height: 56px; padding: 0 var(--s-3);
    display: flex; align-items: baseline; justify-content: center; gap: var(--s-2);
    border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--shadow-1); cursor: text;
  }
  .step-val:focus-within { box-shadow: var(--shadow-1), inset 0 0 0 2px var(--ink); }
  .step-val input {
    width: 4ch; min-width: 0; border: 0; background: transparent; color: var(--ink); outline: none; text-align: right;
    font-size: var(--fs-l); font-weight: var(--w-2); line-height: 56px; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .step-val input::-webkit-inner-spin-button, .step-val input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .step-val span { color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-2); }
  .presets { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .preset {
    min-height: 44px; padding: 0 var(--s-4); border: 0; border-radius: 999px;
    background: var(--track); color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-2); font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .preset[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .switch-row {
    width: 100%; display: flex; align-items: center; gap: var(--s-4);
    padding: var(--s-4); border: 0; border-radius: var(--r-ctl);
    background: var(--surface); box-shadow: var(--shadow-1); text-align: left; cursor: pointer;
  }
  .switch-row > div { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .switch-row small { color: var(--ink-3); font-size: var(--fs-s); }
  .switch { width: 52px; height: 32px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
  [aria-checked="true"] > .switch { background: var(--ok); }
  [aria-checked="true"] > .switch::after { transform: translateX(20px); }

  /* ---------- Turn */
  .who {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: var(--s-4);
    padding: var(--s-4) var(--s-5);
    border-radius: var(--r-card); background: var(--team); color: var(--on-color);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--team) 35%, transparent);
  }
  .who-pawn { width: 48px; height: 48px; border-radius: var(--r-ctl); background: rgb(255 255 255 / .22); display: grid; place-items: center; flex: none; }
  .who-pawn svg { width: 28px; height: 28px; }
  .who-text { flex: 1; min-width: 0; }
  .who .label { color: inherit; opacity: .8; }
  .who h2 { font-size: var(--fs-l); font-weight: var(--w-2); line-height: 1.15; overflow-wrap: anywhere; }
  .need { display: grid; justify-items: end; flex: none; }
  .need b { font-size: var(--fs-l); line-height: 1; font-variant-numeric: tabular-nums; }
  .need span { font-size: var(--fs-s); opacity: .85; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr) 64px; gap: var(--s-2); }
  .modes.locked { grid-template-columns: repeat(3, 1fr); }
  .mode {
    min-height: 88px; padding: var(--s-2) var(--s-1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-2);
    border: 0; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--shadow-1);
    font-size: var(--fs-s); font-weight: var(--w-2); color: var(--ink-2);
    cursor: pointer; transition: transform .15s, background .15s, color .15s, box-shadow .15s;
  }
  .mode-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--mc, var(--ink)) 14%, transparent); color: var(--mc, var(--ink-2)); }
  .mode-ic svg { width: 24px; height: 24px; }
  .mode[aria-checked="true"] { background: var(--mc); color: var(--on-mode); transform: translateY(-2px); box-shadow: 0 10px 24px color-mix(in srgb, var(--mc) 40%, transparent); }
  .mode[aria-checked="true"] .mode-ic { background: rgb(255 255 255 / .22); color: var(--on-mode); }
  .mode[disabled] { cursor: default; opacity: .45; }
  .mode[disabled][aria-checked="true"] { opacity: 1; }
  .lock { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--fs-s); font-weight: var(--w-2); color: var(--ink-3); }
  .lock svg { width: 14px; height: 14px; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
  .level {
    min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-1);
    border: 0; border-radius: var(--r-ctl); background: var(--surface); box-shadow: var(--shadow-1); color: var(--ink);
    cursor: pointer; transition: transform .15s, background .15s, color .15s;
  }
  .level small { font-size: var(--fs-s); color: var(--ink-3); }
  .level[aria-checked="true"] { background: var(--ink); color: var(--bg); transform: translateY(-2px); box-shadow: var(--shadow-2); }
  .level[aria-checked="true"] small { color: inherit; opacity: .7; }
  .pips { display: inline-flex; gap: var(--s-1); }
  .pips i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pips i.off { opacity: .25; }

  .open-banner { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-ctl); background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent-edge); }
  .open-banner svg { width: 28px; height: 28px; flex: none; }
  .open-banner div { display: grid; gap: 2px; }
  .open-banner small { color: var(--ink-2); font-size: var(--fs-s); }

  /* ---------- Play */
  .playhead { display: flex; align-items: center; gap: var(--s-2); }
  .chip-team, .chip-mode { display: inline-flex; align-items: center; gap: 6px; height: 36px; border-radius: 999px; font-size: var(--fs-s); font-weight: var(--w-2); min-width: 0; }
  .chip-team { padding: 0 var(--s-3) 0 var(--s-2); background: var(--team); color: var(--on-color); max-width: 42%; }
  .chip-team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-team svg, .chip-mode svg { width: 18px; height: 18px; flex: none; }
  .chip-mode { padding: 0 var(--s-3); background: color-mix(in srgb, var(--mc) 14%, var(--surface)); color: var(--ink); }
  .chip-mode svg, .chip-mode .pips { color: var(--mc); }
  .chip-mode .pips i { width: 6px; height: 6px; }

  .stage { flex: 1; display: grid; place-items: center; min-height: 0; }
  .ring {
    position: relative; width: min(64vw, 30vh, 260px); aspect-ratio: 1; max-width: 100%;
    border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; touch-action: manipulation;
    filter: drop-shadow(0 12px 24px rgb(27 30 48 / .12));
  }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .face { fill: var(--surface); }
  .ring .trk { fill: none; stroke: var(--track); stroke-width: 16; }
  .ring .bar { fill: none; stroke: var(--mc); stroke-width: 16; stroke-linecap: round; transition: stroke .3s; }
  .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
  .time { font-size: var(--fs-xl); font-weight: var(--w-2); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; transition: color .3s, opacity .2s; }
  .thint { font-size: var(--fs-s); font-weight: var(--w-2); color: var(--ink-3); }
  .time-pill { display: flex; align-items: baseline; gap: 6px; height: 44px; padding: 0 var(--s-3); border: 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-1); cursor: pointer; }
  .time-pill .time { font-size: var(--fs-l); line-height: 44px; }
  .draw-timer { display: flex; align-items: center; gap: var(--s-3); }
  .draw-timer .lin { flex: 1; }
  .lin { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }

    pause() { togglePause(); },
    guessed(arg) {
      if (!running && state.turn.remaining <= 0) return;
      const idx = arg === undefined ? state.current : Number(arg);
      if (score(idx)) { finishRound(); render(); return; }
      nextWord(idx);
    },
    skip() {
      const t = state.turn;
      t.results.push({ word: t.word, team: null });
      beep(330, 0.08, 0, 0.15, "triangle");
      nextWord();
    },
    stopRound() { closeMenu(); resumeAfterMenu = false; finishRound(); render(); },
    // result
    last(arg) {
      const t = state.turn;
      if (arg === "none") t.results.push({ word: t.word, team: null });
      else score(Number(arg));
      t.lastOpen = false; render();
    },
    next() {
      if (state.winner !== null) { state.phase = "win"; fanfare(); render(); return; }
      state.turnsTaken++;
      state.current = (state.current + 1) % state.teams.length;
      if (state.current === 0) state.round++;
      newTurn(); render(); window.scrollTo(0, 0);
    },
    // win
    rematch() { state.teams.forEach((t) => (t.score = 0)); state.current = 0; state.round = 1; state.winner = null; newTurn(); render(); },
    newGame() { stopTimer(); resumeAfterMenu = false; const keep = { teams: state.teams.map((t) => ({ ...t, score: 0 })), roundTime: state.roundTime, target: state.target, openRounds: state.openRounds, sound: state.sound, used: state.used, modeRule: state.modeRule }; state = { ...fresh(), ...keep }; closeMenu(); render(); },
    // menu
    menu() { if (state.phase === "play" && running) { stopTimer(); resumeAfterMenu = true; } menuOpen = true; confirmEnd = false; sheetView = "menu"; renderMenu(); },
    rules() { if (state.phase === "play" && running) { stopTimer(); resumeAfterMenu = true; } menuOpen = true; confirmEnd = false; sheetView = "rules"; renderMenu(); sheet.querySelector(".sheet-body").scrollTop = 0; },
    closeMenu() { closeMenu(); if (resumeAfterMenu && state.phase === "play") startTimer(); resumeAfterMenu = false; },
    sound() { ensureAudio(); state.sound = !state.sound; renderMenu(); render(); },
    adj(arg) { const [i, d] = arg.split(":").map(Number); const t = state.teams[i]; t.score = Math.max(0, t.score + d); renderMenu(); if (state.phase !== "play") render(); else save(); },
    endGame() { if (!confirmEnd) { confirmEnd = true; renderMenu(); return; } actions.newGame(); },
    // drawing
    undo() { strokes.pop(); redraw(); },
    clear() { strokes = []; redraw(); }
  };
  function closeMenu() { menuOpen = false; confirmEnd = false; sheet.hidden = true; sheet.innerHTML = ""; }

  // ---------------------------------------------------------------- Views
  const timeLabel = () => state.roundTime >= 60 ? fmt(state.roundTime * 1000) + " min" : state.roundTime + " s";
  const pips = (n) => `<span class="pips" role="img" aria-label="${LEVELS[n]}">${[1, 2, 3].map((i) => `<i class="${i <= n ? "" : "off"}"></i>`).join("")}</span>`;
  const bar = (sub) => `<header class="bar"><div class="brand">Drei<span>er</span>lei</div><div class="bar-sub">${sub}</div><button class="icon-btn" data-act="rules" aria-label="Spielregeln">${ICONS.book}</button><button class="icon-btn" data-act="menu" aria-label="Menü">${ICONS.menu}</button></header>`;
  const openBanner = () => `<div class="open-banner">${ICONS.all}<div><b>Offene Runde</b><small>Alle Teams dürfen raten. Jede Karte zählt für das Team, das sie zuerst errät.</small></div></div>`;
  const cardFront = (tr) => `<span class="gcard-head">${ICONS[tr.mode]}<span>${MODES[tr.mode].name}</span>${pips(tr.level)}</span><span class="gcard-body"><span class="gcard-word fit">${esc(tr.word)}</span></span>`;

  // Board: one lane per team. With `from` (scores at turn start) the pawns walk to their new field.
  const board = (opts = {}) => {
    const list = state.teams.map((t, i) => ({ t, i }));
    if (opts.sorted) list.sort((a, b) => b.t.score - a.t.score);
    const pct = (v) => Math.min(100, (v / state.target) * 100).toFixed(2);
    return `<div class="board">${list.map(({ t, i }, rank) => {
      const before = opts.from && opts.from[i] !== undefined ? opts.from[i] : t.score;
      const gain = t.score - before;
      return `<div class="lane t-${t.c}${opts.current && i === state.current ? " current" : ""}">
        <div class="lane-top">${opts.sorted ? `<span class="place">${rank + 1}.</span>` : ""}${ICONS.pawn}<span class="name">${esc(t.name)}</span>${gain > 0 ? `<span class="gain">+${gain}</span>` : ""}<b>${t.score}</b><span class="of">/ ${state.target}</span></div>
        <div class="lane-track"><span class="lane-fill" data-to="${pct(t.score)}" style="width:${pct(before)}%"></span><span class="lane-pawn" data-to="${pct(t.score)}" style="left:${pct(before)}%">${ICONS.pawn}</span>${ICONS.flag}</div>
      </div>`;
    }).join("")}</div>`;
  };
  const stepper = (key, unit, step, act, presets) => `
    <div class="stepper">
      <button class="icon-btn" data-act="step" data-arg="${key}:-${step}" aria-label="Weniger">−</button>
      <label class="step-val"><input id="in-${key}" type="number" inputmode="numeric" data-setting="${key}" min="${LIMITS[key][0]}" max="${LIMITS[key][1]}" value="${state[key]}" aria-label="${unit}"><span>${unit}</span></label>
      <button class="icon-btn" data-act="step" data-arg="${key}:${step}" aria-label="Mehr">+</button>
    </div>
    <div class="presets">${presets.map((v) => `<button class="preset" data-act="${act}" data-arg="${v}" aria-pressed="${state[key] === v}">${v}</button>`).join("")}</div>`;

  const views = {
    setup() {
      return `
      <div class="bar"><div class="grow"></div><button class="pill-btn" data-act="rules">${ICONS.book}Spielregeln</button><button class="icon-btn" data-act="menu" aria-label="Einstellungen">${ICONS.gear}</button></div>
      <div class="hero">
        <div class="fan" aria-hidden="true">${MODE_KEYS.map((m) => `<div class="fan-card m-${m}"><span>${ICONS[m]}</span>${MODES[m].name}</div>`).join("")}</div>
        <h1 class="title">Drei<span>er</span>lei</h1>
        <p class="lede">Erklären, zeichnen, vorspielen: Begriffe raten mit einem Handy und zwei bis sechs Teams.</p>
      </div>
      <section class="group">
        <h2 class="label">Teams</h2>
        <div class="teams">
          ${state.teams.map((t, i) => `
            <div class="team-row t-${t.c}">${ICONS.pawn}
              <input id="team-${t.c}" data-team="${i}" value="${esc(t.name)}" maxlength="24" aria-label="Name von Team ${i + 1}" autocomplete="off">
              ${state.teams.length > 2 ? `<button class="icon-btn" data-act="removeTeam" data-arg="${i}" aria-label="Team entfernen">${ICONS.close}</button>` : ""}
            </div>`).join("")}
          ${state.teams.length < 6 ? `<button class="add" data-act="addTeam">${ICONS.plus}Team hinzufügen</button>` : ""}
        </div>
      </section>
      <section class="group">
        <h2 class="label">Spielmodus</h2>
        <div class="opts" role="radiogroup">
          <button class="opt" role="radio" id="rule-frei" aria-checked="${!alternating()}" data-act="setRule" data-arg="frei">${ICONS.shuffle}<b>Frei wählen</b><small>Jedes Team wählt die Darstellung selbst oder würfelt.</small></button>
          <button class="opt" role="radio" id="rule-wechsel" aria-checked="${alternating()}" data-act="setRule" data-arg="wechsel">${ICONS.repeat}<b>Immer abwechseln</b><small>Jede Runde eine andere: Erklären, Zeichnen, Pantomime.</small></button>
        </div>
      </section>
      <section class="group"><h2 class="label">Zeit pro Runde</h2>${stepper("roundTime", "Sekunden", 10, "setTime", [60, 90, 120, 180])}</section>
      <section class="group"><h2 class="label">Punkte zum Sieg</h2>${stepper("target", "Punkte", 5, "setTarget", [30, 50, 80, 100])}</section>
      <button class="switch-row" id="openRounds" role="switch" aria-checked="${state.openRounds}" data-act="toggleOpen">
        <div><b>Offene Runden</b><small>Ab und zu dürfen alle Teams mitraten. Jede Karte zählt für das Team, das sie zuerst errät.</small></div>
        <span class="switch"></span>
      </button>
      <div class="cta"><button class="btn btn-primary" data-act="start">${ICONS.play}Spiel starten</button></div>`;
    },

    turn() {
      const t = team(), tr = state.turn, lock = alternating();
      const need = Math.max(0, state.target - t.score);
      return `
      ${bar("Runde " + state.round)}
      <div class="who t-${t.c}">
        <span class="who-pawn">${ICONS.pawn}</span>
        <div class="who-text"><p class="label">Am Zug</p><h2>${esc(t.name)}</h2></div>
        <div class="need"><b>${need}</b><span>bis zum Ziel</span></div>
      </div>
      <section class="group">
        <div class="label-row"><h3 class="label">Darstellung</h3>${lock ? `<span class="lock">${ICONS.lock}Runde ${state.round} ist vorgegeben</span>` : ""}</div>
        <div class="modes${lock ? " locked" : ""}" role="radiogroup" aria-label="Darstellung">
          ${MODE_KEYS.map((m) => `<button class="mode m-${m}" role="radio" id="mode-${m}" aria-checked="${tr.mode === m}" ${lock ? "disabled" : `data-act="mode" data-arg="${m}"`}><span class="mode-ic">${ICONS[m]}</span>${MODES[m].name}</button>`).join("")}
          ${lock ? "" : `<button class="mode" data-act="roll" aria-label="Darstellung auswürfeln"><span class="mode-ic">${ICONS.dice}</span>Würfeln</button>`}
        </div>
        <p class="hint-text">${lock ? `<b>Alle Teams ${MODES[tr.mode].verb}.</b> Nächste Runde: ${MODES[roundMode(state.round + 1)].name}. ` : ""}${MODES[tr.mode].rule}</p>
      </section>
      <section class="group">
        <h3 class="label">Schwierigkeit</h3>
        <div class="levels" role="radiogroup" aria-label="Schwierigkeit">
          ${[1, 2, 3].map((l) => `<button class="level" role="radio" id="level-${l}" aria-checked="${tr.level === l}" data-act="level" data-arg="${l}">${pips(l)}<b>${LEVELS[l]}</b><small>${pts(l)}</small></button>`).join("")}
        </div>
      </section>
      ${tr.open ? openBanner() : ""}
      <div class="grow"></div>
      <div class="cta"><p class="handoff-hint">${ICONS.phone}Handy an die Person geben, die darstellt</p><button class="btn btn-primary" data-act="draw">Karte ziehen · ${timeLabel()}</button></div>`;
    },

    play() {
      const t = team(), tr = state.turn, m = MODES[tr.mode];
      const menuBtn = `<button class="icon-btn" data-act="menu" aria-label="Menü">${ICONS.menu}</button>`;
      const timePill = `<button class="time-pill" data-act="pause" aria-label="Pause oder weiter"><span class="time" id="time">${fmt(tr.remaining)}</span><span class="thint" id="thint"></span></button>`;
      const head = `<div class="playhead"><span class="chip-team t-${t.c}">${ICONS.pawn}<span>${esc(t.name)}</span></span><span class="chip-mode m-${tr.mode}">${ICONS[tr.mode]}${m.name}${pips(tr.level)}</span><span class="grow"></span>${menuBtn}</div>`;
      const flip = (slim) => `<button class="flip m-${tr.mode}${slim ? " slim" : ""}" id="peek" aria-label="Gedrückt halten, um den Begriff zu sehen"><span class="flip-inner"><span class="gcard face-back"><span class="back-emblem">${ICONS[tr.mode]}</span><span class="back-hint">${ICONS.eye}Zum Ansehen gedrückt halten</span></span><span class="gcard face-front">${cardFront(tr)}</span></span></button>`;
      const got = tr.results.filter((r) => r.team !== null).length;
      const tally = `<p class="tally">${got ? `${ICONS.check}${got} erraten · +${got * tr.level} Punkte` : `So viele Karten wie möglich · ${pts(tr.level)} je Karte`}</p>`;
      const btns = tally + (tr.open
        ? `<div class="openpick"><p class="label">Erraten hat</p><div class="pick3">${state.teams.map((x, i) => `<button class="btn btn-team t-${x.c}" data-act="guessed" data-arg="${i}"><span>${esc(x.name)}</span></button>`).join("")}</div><button class="btn btn-secondary" data-act="skip">Überspringen</button></div>`
        : `<div class="row"><button class="btn btn-secondary" data-act="skip">Überspringen</button><button class="btn btn-ok" data-act="guessed">${ICONS.check}Erraten!</button></div>`);
      if (tr.mode === "zeichnen") {
        return `
        ${head}
        <div class="draw-timer"><div class="lin m-${tr.mode}"><span id="lin"></span></div>${timePill}</div>
        <div class="pad-wrap">
          <canvas id="pad"></canvas>
          <div class="pad-empty" id="padempty">Hier zeichnen</div>
          <div class="pad-tools">
            <button class="icon-btn" data-act="undo" aria-label="Rückgängig">${ICONS.undo}</button>
            <button class="icon-btn" data-act="clear" aria-label="Alles löschen">${ICONS.trash}</button>
          </div>
        </div>
        ${flip(true)}${btns}`;
      }
      return `
      ${head}
      <div class="stage m-${tr.mode}">
        <button class="ring" data-act="pause" aria-label="Pause oder weiter">
          <svg viewBox="0 0 320 320" aria-hidden="true">
            <circle class="face" cx="160" cy="160" r="132"/>
            <circle class="trk" cx="160" cy="160" r="146"/>
            <circle class="bar" id="rbar" cx="160" cy="160" r="146" style="stroke-dasharray:${RC}"/>
          </svg>
          <span class="readout"><span class="time" id="time">${fmt(tr.remaining)}</span><span class="thint" id="thint"></span></span>
        </button>
      </div>
      ${tr.mode === "erklaeren" ? `<div class="gcard m-${tr.mode}" id="wordcard">${cardFront(tr)}</div>` : flip(false)}
      ${btns}`;
    },

    result() {
      const t = team(), tr = state.turn, lv = tr.level;
      const got = tr.results.filter((r) => r.team !== null);
      const chips = tr.results.length ? `<section class="group"><h3 class="label">Karten dieser Runde</h3><div class="chips">${tr.results.map((r) => r.team === null
        ? `<span class="wchip miss">${ICONS.x}<span>${esc(r.word)}</span></span>`
        : `<span class="wchip hit t-${team(r.team).c}">${tr.open ? `<i class="dot"></i>` : ICONS.check}<span>${esc(r.word)}</span><b>+${lv}</b></span>`).join("")}</div></section>` : "";
      if (tr.lastOpen) {
        const answer = tr.open
          ? `<div class="pick">${state.teams.map((x, i) => `<button class="btn btn-team t-${x.c}" data-act="last" data-arg="${i}"><span>${esc(x.name)}</span></button>`).join("")}<button class="btn btn-secondary" data-act="last" data-arg="none">Niemand</button></div>`
          : `<div class="row-even"><button class="btn btn-secondary" data-act="last" data-arg="none">Nein</button><button class="btn btn-ok" data-act="last" data-arg="${state.current}">${ICONS.check}Ja, erraten</button></div>`;
        return `
        ${bar(esc(t.name))}
        <div class="timeup">${ICONS.clock}<p class="label">Zeit um</p><h2>${tr.open ? "Hat ein Team diese Karte noch rechtzeitig erraten?" : "Wurde diese Karte noch rechtzeitig erraten?"}</h2></div>
        <div class="gcard small m-${tr.mode}">${cardFront(tr)}</div>
        ${chips}
        <div class="grow"></div>
        <div class="cta">${answer}</div>`;
      }
      let hero;
      if (state.winner !== null) {
        const w = team(state.winner);
        hero = `<div class="summary champ t-${w.c}"><span class="trophy">${ICONS.trophy}</span><p class="label">Ziel erreicht</p><p class="big fit">${esc(w.name)}</p><p class="sub">hat ${w.score} Punkte</p></div>`;
      } else if (tr.open) {
        hero = `<div class="summary${got.length ? " good" : ""}"><p class="label">${tr.timeUp ? "Zeit um" : "Runde beendet"} · offene Runde</p><p class="big">${got.length}</p><p class="sub">${got.length === 1 ? "Karte" : "Karten"} erraten</p></div>`;
      } else {
        hero = `<div class="summary${got.length ? " good" : ""}"><p class="label">${tr.timeUp ? "Zeit um" : "Runde beendet"}</p><p class="big">+${got.length * lv}</p><p class="sub">${got.length ? `${got.length} ${got.length === 1 ? "Karte" : "Karten"} erraten · ${esc(t.name)}` : "Keine Karte erraten"}</p></div>`;
      }
      const nextTeam = team((state.current + 1) % state.teams.length);
      return `
      ${bar(esc(t.name))}
      ${hero}
      ${chips}
      <section class="group"><h3 class="label">Spielfeld</h3>${board({ from: tr.before, current: true })}</section>
      <div class="grow"></div>
      <div class="cta">${state.winner !== null
        ? `<button class="btn btn-primary" data-act="next">${ICONS.trophy}Zur Siegerehrung</button>`
        : `<button class="btn btn-primary" data-act="next"><span>Weiter: ${esc(nextTeam.name)}</span>${ICONS.skip}</button>`}</div>`;
    },

    win() {
      const w = team(state.winner);
      return `
      ${bar("Spielende")}
      <div class="winner t-${w.c}"><canvas id="confetti" aria-hidden="true"></canvas>
        <span class="cup">${ICONS.trophy}</span>
        <p class="label">Gewonnen</p><h1 class="fit">${esc(w.name)}</h1><p>${w.score} Punkte nach ${state.round} ${state.round === 1 ? "Runde" : "Runden"}</p>
      </div>
      <section class="group"><h3 class="label">Endstand</h3>${board({ sorted: true })}</section>
      <div class="grow"></div>
      <div class="cta row-even"><button class="btn btn-secondary" data-act="newGame">Neues Spiel</button><button class="btn btn-primary" data-act="rematch">Revanche</button></div>`;
    }
  };

  function rulesView() {
    const time = state.roundTime >= 60 ? fmt(state.roundTime * 1000) + " Minuten" : state.roundTime + " Sekunden";
    return `
      <div class="sheet-body rules-sheet" role="dialog" aria-label="Spielregeln">
        <div class="bar"><h2 class="grow">Spielregeln</h2><button class="icon-btn" data-act="closeMenu" aria-label="Schließen">${ICONS.close}</button></div>
        <section><h3 class="label">Ziel</h3>
          <p>Die Teams erraten Begriffe, die eine Person aus dem eigenen Team <b>erklärt</b>, <b>zeichnet</b> oder als <b>Pantomime</b> vorspielt. Das erste Team mit ${state.target} Punkten gewinnt sofort.</p>
        </section>
        <section><h3 class="label">Ein Zug</h3>
          <ol class="rule-list">
            <li>Das Team am Zug wählt die Darstellung (oder würfelt) und die Schwierigkeit. Im Modus <b>Immer abwechseln</b> ist die Darstellung vorgegeben.</li>
            <li>Eine Person aus dem Team nimmt das Handy und tippt auf <b>Karte ziehen</b>. Die erste Karte erscheint, die Zeit läuft (${time}).</li>
            <li>Das eigene Team rät so viele Karten wie möglich. <b>Erraten!</b> gibt die Punkte und zieht sofort die nächste Karte. <b>Überspringen</b> kostet keine Punkte, nur Zeit.</li>
            <li>Ist die Zeit um, zählt die letzte Karte nur, wenn sie noch rechtzeitig erraten wurde. Dann ist das nächste Team dran, am besten mit einer anderen Person.</li>
          </ol>
        </section>
        <section><h3 class="label">Die drei Darstellungen</h3>
          <div class="rule-modes">
            ${MODE_KEYS.map((m) => `<div class="rule-mode"><span class="rm-icon m-${m}">${ICONS[m]}</span><div><b>${MODES[m].name}</b><p>${MODES[m].rule} ${m === "erklaeren" ? "Die Karte liegt offen auf dem Bildschirm." : "Die Karte liegt verdeckt. Wer sie gedrückt hält, sieht den Begriff."}</p></div></div>`).join("")}
          </div>
        </section>
        <section><h3 class="label">Schwierigkeit und Punkte</h3>
          <p>Jede Karte zählt <b>1 Punkt</b> (leicht), <b>2 Punkte</b> (mittel) oder <b>3 Punkte</b> (schwer). Für jede Darstellung gibt es eigene Begriffe: Leicht ist sofort erkennbar, mittel braucht mehrere Schritte, schwer sind abstrakte Begriffe, Märchen, Filme und Redewendungen.</p>
        </section>
        <section><h3 class="label">Spielmodi</h3>
          <p><b>Frei wählen:</b> Jedes Team sucht sich die Darstellung vor seinem Zug aus oder würfelt.</p>
          <p><b>Immer abwechseln:</b> Runde 1 wird erklärt, Runde 2 gezeichnet, Runde 3 pantomimisch gespielt, danach geht es von vorn los. In jeder Runde ist jedes Team einmal dran.</p>
        </section>
        <section><h3 class="label">Offene Runden</h3>
          <p>Ist die Einstellung an, dürfen etwa in jedem sechsten Zug alle Teams mitraten. Statt „Erraten!“ gibt es dann einen Knopf pro Team: Wer eine Karte zuerst errät, bekommt die Punkte.</p>
        </section>
        <section><h3 class="label">Gut zu wissen</h3>
          <p>Ein Tipp auf den Timer pausiert die Runde. Im Menü lassen sich Punkte korrigieren und Runden vorzeitig beenden. Der Spielstand bleibt erhalten, auch wenn die Seite neu geladen wird.</p>
        </section>
        <button class="btn btn-primary" data-act="closeMenu">${state.phase === "play" ? "Weiterspielen" : "Verstanden"}</button>
      </div>`;
  }

  function renderMenu() {
    if (!menuOpen) return;
    if (sheetView === "rules") { sheet.innerHTML = rulesView(); sheet.hidden = false; return; }
    const inGame = state.phase !== "setup";
    sheet.innerHTML = `
      <div class="sheet-body" role="dialog" aria-label="Menü">
        <div class="bar"><h2 class="grow">${inGame ? "Menü" : "Einstellungen"}</h2><button class="icon-btn" data-act="closeMenu" aria-label="Schließen">${ICONS.close}</button></div>
        <button class="switch-row" role="switch" aria-checked="${state.sound}" data-act="sound">
          <div><b>Ton</b><small>Ticken in den letzten 10 Sekunden und Alarm bei Zeitende.</small></div><span class="switch"></span>
        </button>
        ${inGame ? `
        <section class="panel"><h3 class="label">Punkte korrigieren</h3>
          ${state.teams.map((t, i) => `
            <div class="adj t-${t.c}">${ICONS.pawn}<span class="name">${esc(t.name)}</span>
              <button class="icon-btn" data-act="adj" data-arg="${i}:-1" aria-label="Minus">−</button><b>${t.score}</b><button class="icon-btn" data-act="adj" data-arg="${i}:1" aria-label="Plus">+</button>
            </div>`).join("")}
        </section>
        <button class="btn btn-secondary" data-act="rules">${ICONS.book}Spielregeln</button>
        ${state.phase === "play" ? `<button class="btn btn-secondary" data-act="stopRound">Runde jetzt beenden</button>` : ""}
        <button class="btn btn-secondary${confirmEnd ? " danger" : ""}" data-act="endGame">${confirmEnd ? "Wirklich beenden? Nochmal tippen" : "Spiel beenden"}</button>` : ""}
        <button class="btn btn-primary" data-act="closeMenu">${state.phase === "play" ? "Weiterspielen" : "Schließen"}</button>
      </div>`;
    sheet.hidden = false;
  }

  // Shrink a word until it fits the card: at most two lines, no single word wider than the card.
  function fitText(root = app) {
    root.querySelectorAll(".fit").forEach((el) => {
      el.style.fontSize = "";
      let size = parseFloat(getComputedStyle(el).fontSize);
      const lineH = () => parseFloat(getComputedStyle(el).lineHeight) || size * 1.05;
      const tooBig = () => el.scrollWidth > el.clientWidth + 1 || el.offsetHeight > lineH() * 2 + 2;
      while (tooBig() && size > 20) { size -= 2; el.style.fontSize = size + "px"; }
      if (tooBig()) el.style.overflowWrap = "anywhere";
    });
  }
  function walkPawns() {
    const els = app.querySelectorAll("[data-to]"); if (!els.length) return;
    requestAnimationFrame(() => requestAnimationFrame(() => els.forEach((el) => {
      const v = el.dataset.to + "%";
      if (el.classList.contains("lane-fill")) el.style.width = v; else el.style.left = v;
    })));
  }
  function popScore(text, rect, teamC) {
    if (!rect || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const el = document.createElement("div");
    el.className = "pop" + (teamC ? " by-team t-" + teamC : "");
    el.textContent = text;
    el.style.left = rect.left + rect.width / 2 + "px";
    el.style.top = rect.top + rect.height / 2 + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  function render() {
    app.className = "screen phase-" + state.phase;
    app.innerHTML = views[state.phase]();
    if (state.phase === "play") { timerUI(); bindPeek(); if (state.turn.mode === "zeichnen") setupPad(); }
    if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => fitText());
    fitText();
    walkPawns();
    if (state.phase === "win") confetti();
    save();
  }

  // ---------------------------------------------------------------- Events
  function onAct(e) {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const fn = actions[b.dataset.act]; if (fn) fn(b.dataset.arg, b);
  }
  app.addEventListener("click", onAct);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) { actions.closeMenu(); return; } onAct(e); });
  app.addEventListener("change", (e) => {
    const k = e.target.dataset.setting; if (!k) return;
    state[k] = clampSetting(k, e.target.value); render();
  });
  app.addEventListener("input", (e) => {
    const k = e.target.dataset.setting;
    if (k) { const n = Number(e.target.value); if (e.target.value !== "" && n >= LIMITS[k][0] && n <= LIMITS[k][1]) { state[k] = Math.round(n); save(); } return; }
    const i = e.target.dataset.team; if (i === undefined) return;
    state.teams[Number(i)].name = e.target.value; save();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && menuOpen) actions.closeMenu();
    if (e.code === "Space" && state.phase === "play" && e.target === document.body) { e.preventDefault(); togglePause(); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) { lockScreen(); loop(); }
    if (document.visibilityState === "hidden") save();
  });

  function bindPeek() {
    const p = document.getElementById("peek"); if (!p) return;
    const on = (e) => { e.preventDefault(); p.classList.add("on"); };
    const off = () => { p.classList.remove("on"); };
    p.addEventListener("pointerdown", on);
    ["pointerup", "pointerleave", "pointercancel", "blur"].forEach((ev) => p.addEventListener(ev, off));
    p.addEventListener("contextmenu", (e) => e.preventDefault());
    p.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") on(e); });
    p.addEventListener("keyup", off);
  }

  // ---------------------------------------------------------------- Drawing pad
  let strokes = [], pad = null, ctx = null, drawing = null;
  function setupPad() {
    pad = document.getElementById("pad"); if (!pad) return;
    ctx = pad.getContext("2d");
    const size = () => {
      const r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    };
    size();
    new ResizeObserver(size).observe(pad);
    const pos = (e) => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
    pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); drawing = [pos(e)]; strokes.push(drawing); redraw(); });
    pad.addEventListener("pointermove", (e) => { if (!drawing) return; (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach((ev) => drawing.push(pos(ev))); redraw(); });
    ["pointerup", "pointercancel"].forEach((ev) => pad.addEventListener(ev, () => { drawing = null; }));
  }
  function redraw() {
    if (!pad || !ctx) return;
    const r = pad.getBoundingClientRect(), W = r.width, H = r.height;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#141A2E";
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of strokes) {
      if (s.length === 1) { ctx.beginPath(); ctx.arc(s[0][0] * W, s[0][1] * H, 2.5, 0, Math.PI * 2); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(s[0][0] * W, s[0][1] * H);
      for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0] * W, s[i][1] * H);
      ctx.stroke();
    }
    const empty = document.getElementById("padempty"); if (empty) empty.hidden = strokes.length > 0;
  }

  // ---------------------------------------------------------------- Confetti (win screen)
  function confetti() {
    const c = document.getElementById("confetti"); if (!c) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const g = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    const r = c.getBoundingClientRect(); c.width = r.width * dpr; c.height = r.height * dpr; g.scale(dpr, dpr);
    const cs = getComputedStyle(c.parentElement);
    const cols = ["--accent", "--on-color", "--surface", "--m-erklaeren", "--m-zeichnen", "--m-pantomime"].map((v) => cs.getPropertyValue(v).trim());
    const bits = Array.from({ length: 70 }, () => ({ x: Math.random() * r.width, y: -Math.random() * r.height, vy: 1 + Math.random() * 2.2, vx: -0.6 + Math.random() * 1.2, s: 4 + Math.random() * 5, a: Math.random() * 6, col: rand(cols) }));
    let frames = 0;
    (function step() {
      if (!document.body.contains(c)) return;
      g.clearRect(0, 0, r.width, r.height);
      bits.forEach((b) => { b.y += b.vy; b.x += b.vx; b.a += 0.1; g.save(); g.translate(b.x, b.y); g.rotate(b.a); g.fillStyle = b.col; g.globalAlpha = .85; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g.restore(); });
      if (++frames < 260) requestAnimationFrame(step); else g.clearRect(0, 0, r.width, r.height);
    })();
  }

  // ---------------------------------------------------------------- Boot
  function boot(data) {
    load(data);
    if (state.phase !== "setup" && !state.turn) newTurn();
    if (state.turn && !Array.isArray(state.turn.results)) { state.turn.results = []; state.turn.lastOpen = false; }
    if (state.phase === "win" && state.winner === null) state.phase = "setup";
    if (state.phase === "reveal") state.phase = "turn";
    running = false;   // a restored round starts paused
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ state: snapshot() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
