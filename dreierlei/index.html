<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E6EEE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dreierlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
  /* Layout: Spieltisch. A calm sage table with flat, printed game pieces on it: white controls, full-colour cards,
     one screen per step and every action at the bottom. Deliberately one light look, also when the phone is in dark mode.
     Type: Bricolage Grotesque, 2 weights, 4 sizes. Spacing on the 8-point grid. */
  :root {
    color-scheme: light;
    --bg: #E6EEE9;
    --surface: #FFFFFF;
    --surface-2: #F3F7F4;
    --ink: #17201B;
    --ink-2: rgb(23 32 27 / .74);
    --ink-3: rgb(23 32 27 / .56);
    --line: rgb(23 32 27 / .12);
    --track: rgb(23 32 27 / .09);
    --press: rgb(23 32 27 / .06);
    --focus: #2B62E3;
    --ok: #127F55; --warn: #C27000; --crit: #D23A2C;
    --on: #FFFFFF;
    --m-erklaeren: #DE5520; --m-zeichnen: #2B62E3; --m-pantomime: #C42F72;
    --blue: #2B4FE0; --red: #D93E3A; --green: #12805F; --yellow: #A87400; --violet: #7444E0; --cyan: #0A7FA0;
    --lift: 0 1px 2px rgb(23 32 27 / .08);
    --font: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-s: 14px; --fs-m: 17px; --fs-l: 26px; --fs-xl: clamp(48px, 14vw, 72px);
    --w-1: 500; --w-2: 800;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
    --r-1: 14px; --r-2: 18px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: var(--fs-m);
    font-weight: var(--w-1);
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3, p, ul, ol { margin: 0; font-weight: inherit; }
  b, strong { font-weight: var(--w-2); }
  svg { display: block; }

  .t-blue { --team: var(--blue); } .t-red { --team: var(--red); } .t-green { --team: var(--green); }
  .t-yellow { --team: var(--yellow); } .t-violet { --team: var(--violet); } .t-cyan { --team: var(--cyan); }
  .m-erklaeren { --mc: var(--m-erklaeren); } .m-zeichnen { --mc: var(--m-zeichnen); } .m-pantomime { --mc: var(--m-pantomime); }

  .screen {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column; gap: var(--s-5);
    padding-block: var(--s-4) var(--s-5);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .phase-play { height: 100%; min-height: 560px; gap: var(--s-4); }
  .grow { flex: 1; }
  .label { font-size: var(--fs-s); color: var(--ink-3); }
  .group { display: grid; gap: var(--s-2); }
  .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); }
  .hint-text { font-size: var(--fs-s); color: var(--ink-3); text-wrap: pretty; }

  /* ---------- Bar + wordmark */
  .bar { display: flex; align-items: center; gap: var(--s-2); }
  .brand { display: flex; align-items: center; gap: var(--s-2); font-weight: var(--w-2); font-size: var(--fs-m); letter-spacing: -0.01em; }
  .mark { position: relative; width: 26px; height: 20px; flex: none; }
  .mark i { position: absolute; bottom: 0; width: 12px; height: 17px; border-radius: 3px; background: var(--mc); box-shadow: 0 0 0 1.5px var(--bg); }
  .mark i:nth-child(1) { left: 0; transform: rotate(-14deg); }
  .mark i:nth-child(2) { left: 7px; bottom: 2px; }
  .mark i:nth-child(3) { left: 14px; transform: rotate(14deg); }
  .bar-sub { flex: 1; min-width: 0; color: var(--ink-3); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    border: 0; border-radius: var(--r-1);
    background: var(--surface); color: var(--ink); box-shadow: var(--lift);
    cursor: pointer;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }
  .pill-btn {
    height: 44px; padding: 0 var(--s-4);
    display: inline-flex; align-items: center; gap: var(--s-2);
    border: 0; border-radius: var(--r-1); background: var(--surface); box-shadow: var(--lift);
    font-size: var(--fs-s); font-weight: var(--w-2); cursor: pointer;
  }
  .pill-btn svg { width: 20px; height: 20px; }

  /* ---------- Buttons: flat, solid, a short press */
  .btn {
    min-height: 56px; padding: 0 var(--s-5);
    border: 0; border-radius: var(--r-1);
    font-size: var(--fs-m); font-weight: var(--w-2);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
    cursor: pointer; transition: transform .08s ease, filter .08s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(.94); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn[disabled] { opacity: .4; cursor: default; transform: none; }
  .btn-primary { background: var(--ink); color: var(--on); }
  .btn-ok { background: var(--ok); color: var(--on); }
  .btn-team { background: var(--team); color: var(--on); }
  .btn-secondary { background: var(--surface); color: var(--ink); box-shadow: var(--lift); }
  .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: var(--s-3); }
  .row-even { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-3); }
  .foot { display: grid; gap: var(--s-2); }
  .foot.sticky { position: sticky; bottom: 0; z-index: 2; margin-bottom: calc(-1 * var(--s-5)); padding-block: var(--s-3) var(--s-5); background: linear-gradient(to bottom, transparent, var(--bg) var(--s-3)); }
  .handoff-hint { display: flex; align-items: center; justify-content: center; gap: var(--s-2); color: var(--ink-3); font-size: var(--fs-s); }
  .handoff-hint svg { width: 18px; height: 18px; }

  /* ---------- Setup wizard */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-1); }
  .steps i { height: 4px; border-radius: 2px; background: var(--track); }
  .steps i.on { background: var(--ink); }
  .intro { display: grid; gap: var(--s-1); }
  .q { font-size: var(--fs-l); font-weight: var(--w-2); line-height: 1.15; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); }

  .teams { display: grid; gap: var(--s-2); }
  .team-row {
    display: flex; align-items: center; gap: var(--s-3);
    padding-left: var(--s-4); border-radius: var(--r-1);
    background: var(--surface); box-shadow: var(--lift);
  }
  .team-row:focus-within { box-shadow: inset 0 0 0 2px var(--team); }
  .token { width: 20px; height: 20px; border-radius: 50%; background: var(--team); flex: none; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); }
  .team-row input { flex: 1; min-width: 0; height: 52px; border: 0; background: transparent; color: var(--ink); font-weight: var(--w-2); outline: none; }
  .team-row .icon-btn { background: transparent; box-shadow: none; color: var(--ink-3); }
  .teams.dense .team-row input { height: 46px; }
  .add {
    min-height: 52px; display: flex; align-items: center; justify-content: center; gap: var(--s-2);
    border: 1.5px dashed var(--ink-3); border-radius: var(--r-1); background: transparent;
    color: var(--ink-2); font-weight: var(--w-2); cursor: pointer;
  }
  .add svg { width: 20px; height: 20px; }

  .opts { display: grid; gap: var(--s-2); }
  .opt {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-4); border: 0; border-radius: var(--r-1);
    background: var(--surface); box-shadow: var(--lift);
    text-align: left; cursor: pointer;
  }
  .opt > svg { width: 28px; height: 28px; flex: none; color: var(--ink-2); }
  .opt > span { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .opt small { font-size: var(--fs-s); color: var(--ink-3); }
  .radio { width: 24px; height: 24px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); }
  .opt[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
  .opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 7px var(--ink); }

  .switch-row {
    width: 100%; display: flex; align-items: center; gap: var(--s-4);
    padding: var(--s-4); border: 0; border-radius: var(--r-1);
    background: var(--surface); box-shadow: var(--lift); text-align: left; cursor: pointer;
  }
  .switch-row > span:first-child { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .switch-row small { color: var(--ink-3); font-size: var(--fs-s); }
  .switch { width: 52px; height: 32px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
  [aria-checked="true"] > .switch { background: var(--ok); }
  [aria-checked="true"] > .switch::after { transform: translateX(20px); }

  .stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: var(--s-2); align-items: center; }
  .stepper .icon-btn { width: 56px; height: 56px; font-size: var(--fs-l); font-weight: var(--w-2); }
  .step-val {
    height: 56px; padding: 0 var(--s-3);
    display: flex; align-items: baseline; justify-content: center; gap: var(--s-2);
    border-radius: var(--r-1); background: var(--surface); box-shadow: var(--lift); cursor: text;
  }
  .step-val:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
  .step-val input {
    width: 4ch; min-width: 0; border: 0; background: transparent; color: var(--ink); outline: none; text-align: right;
    font-size: var(--fs-l); font-weight: var(--w-2); line-height: 56px; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .step-val input::-webkit-inner-spin-button, .step-val input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .step-val span { color: var(--ink-3); font-size: var(--fs-s); }
  .presets { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .preset {
    min-height: 44px; min-width: 56px; padding: 0 var(--s-3); border: 0; border-radius: 12px;
    background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-2); font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .preset[aria-pressed="true"] { background: var(--ink); box-shadow: none; color: var(--on); }

  /* ---------- Turn */
  .who { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) var(--s-5); border-radius: var(--r-2); background: var(--team); color: var(--on); }
  .who-text { flex: 1; min-width: 0; }
  .who .label { color: inherit; opacity: .8; }
  .who h2 { font-size: var(--fs-l); font-weight: var(--w-2); line-height: 1.1; overflow-wrap: anywhere; }
  .need { display: grid; justify-items: end; flex: none; text-align: right; }
  .need b { font-size: var(--fs-l); line-height: 1; font-variant-numeric: tabular-nums; }
  .need span { font-size: var(--fs-s); opacity: .85; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr) 60px; gap: var(--s-2); }
  .modes.locked { grid-template-columns: repeat(3, 1fr); }
  .mode {
    min-height: 84px; padding: var(--s-2) var(--s-1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-2);
    border: 0; border-radius: var(--r-1); background: var(--surface); box-shadow: var(--lift);
    font-size: var(--fs-s); font-weight: var(--w-2); color: var(--ink-2); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode svg { width: 28px; height: 28px; color: var(--mc, var(--ink-2)); }
  .mode[aria-checked="true"] { background: var(--mc); color: var(--on); box-shadow: none; }
  .mode[aria-checked="true"] svg { color: var(--on); }
  .mode[disabled] { cursor: default; opacity: .5; }
  .mode[disabled][aria-checked="true"] { opacity: 1; }
  .lock { display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--fs-s); color: var(--ink-3); }
  .lock svg { width: 14px; height: 14px; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
  .level {
    min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-1);
    border: 0; border-radius: var(--r-1); background: var(--surface); box-shadow: var(--lift); color: var(--ink); cursor: pointer;
  }
  .level small { font-size: var(--fs-s); color: var(--ink-3); }
  .level[aria-checked="true"] { background: var(--ink); color: var(--on); box-shadow: none; }
  .level[aria-checked="true"] small { color: inherit; opacity: .75; }
  .pips { display: inline-flex; gap: var(--s-1); }
  .pips i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pips i.off { opacity: .28; }

  .open-banner { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-1); background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
  .open-banner svg { width: 26px; height: 26px; flex: none; }
  .open-banner span { font-size: var(--fs-s); }

  /* ---------- Play */
  .playhead { display: flex; align-items: center; gap: var(--s-2); }
  .chip-team, .chip-mode { display: inline-flex; align-items: center; gap: var(--s-2); height: 36px; padding: 0 var(--s-3); border-radius: 10px; font-size: var(--fs-s); font-weight: var(--w-2); min-width: 0; }
  .chip-team { background: var(--surface); box-shadow: var(--lift); max-width: 46%; }
  .chip-team .token { width: 14px; height: 14px; }
  .chip-team span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-mode { color: var(--ink-2); padding-left: var(--s-1); }
  .chip-mode svg { width: 18px; height: 18px; color: var(--mc); }
  .chip-mode .pips { color: var(--mc); }
  .chip-mode .pips i { width: 6px; height: 6px; }

  .clock { display: grid; justify-items: center; gap: 2px; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  .time { font-size: var(--fs-xl); font-weight: var(--w-2); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; transition: color .3s, opacity .2s; }
  .thint { font-size: var(--fs-s); color: var(--ink-3); }
  .lin { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .lin span { display: block; width: 100%; height: 100%; background: var(--mc); transform-origin: left; }
  .draw-timer { display: flex; align-items: center; gap: var(--s-3); }
  .draw-timer .lin { flex: 1; }
  .time-pill { display: flex; align-items: baseline; gap: 6px; height: 44px; padding: 0 var(--s-3); border: 0; border-radius: var(--r-1); background: var(--surface); box-shadow: var(--lift); cursor: pointer; }
  .time-pill .time { font-size: var(--fs-l); line-height: 44px; }
  [data-tphase="warn"] .lin span { background: var(--warn); }
  [data-tphase="crit"] .lin span { background: var(--crit); }
  [data-tphase="warn"] .time { color: var(--warn); }
  [data-tphase="crit"] .time { color: var(--crit); }
  [data-tphase="crit"][data-running="true"] .clock .time { animation: beat 1s ease-in-out infinite; }
  [data-running="false"] .time { opacity: .4; }
  @keyframes beat { 50% { transform: scale(1.05); } }

  /* Printed playing card: full colour, inner frame, corner index top-left and mirrored bottom-right */
  .card {
    position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: var(--s-3);
    min-height: 196px; padding: var(--s-4) var(--s-5);
    border-radius: var(--r-2); background: var(--mc); color: var(--on); overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 8px; border-radius: 12px; border: 1.5px solid rgb(255 255 255 / .45); pointer-events: none; }
  .card-top, .card-bot { position: relative; display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-s); font-weight: var(--w-2); }
  .card-top svg, .card-bot svg { width: 18px; height: 18px; }
  .card-top .pips { margin-left: auto; }
  .card-bot { transform: rotate(180deg); opacity: .8; }
  .card-word { position: relative; display: block; max-width: 100%; margin: auto 0; text-align: center; font-size: var(--fs-xl); font-weight: var(--w-2); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: normal; }
  .play-card { flex: 1; }
  .taboo { position: relative; display: grid; justify-items: center; gap: var(--s-1); }
  .taboo-label { font-size: var(--fs-s); opacity: .8; }
  .taboo-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .taboo-list span { padding: 2px var(--s-2); border-radius: 8px; background: rgb(255 255 255 / .2); font-size: var(--fs-s); font-weight: var(--w-2); }
  .deal { animation: deal .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes deal { from { transform: translateX(40px) rotate(4deg); opacity: 0; } }

  .flip { display: block; width: 100%; min-height: 196px; padding: 0; border: 0; background: none; perspective: 1000px; cursor: pointer; touch-action: none; -webkit-touch-callout: none; text-align: inherit; }
  .flip.play-card { flex: 1; }
  .flip-inner { position: relative; display: block; width: 100%; height: 100%; min-height: inherit; transform-style: preserve-3d; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .flip.on .flip-inner { transform: rotateY(180deg); }
  .face-back, .face-front { position: absolute; inset: 0; min-height: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face-front { transform: rotateY(180deg); }
  .face-back { align-items: center; justify-content: center; background-image: radial-gradient(rgb(255 255 255 / .16) 1.5px, transparent 2px); background-size: 14px 14px; }
  .back-icon { position: relative; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: var(--mc); box-shadow: 0 0 0 1.5px rgb(255 255 255 / .6); }
  .back-icon svg { width: 44px; height: 44px; }
  .back-hint { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: var(--s-2) var(--s-3); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: var(--fs-s); font-weight: var(--w-2); }
  .back-hint svg { width: 16px; height: 16px; }
  .flip.slim { min-height: 76px; height: 76px; }
  .flip.slim .card { padding: var(--s-2) var(--s-4); }
  .flip.slim .card-top, .flip.slim .card-bot, .flip.slim .back-icon { display: none; }
  .flip.slim .card-word { font-size: var(--fs-l); }
  .flip.fresh .back-hint { animation: nudge .35s ease-in-out 3; }
  @keyframes nudge { 50% { transform: scale(1.07); } }

  .tally { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-3); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
  .tally svg { width: 16px; height: 16px; color: var(--ok); }
  .openpick { display: grid; gap: var(--s-2); }
  .pick3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
  .pick3 .btn { min-height: 48px; }
  .pick3 .btn, .pick .btn { min-height: 52px; padding: 0 var(--s-2); font-size: var(--fs-s); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }

  .pad-wrap { flex: 1; position: relative; min-height: 200px; overflow: hidden; border-radius: var(--r-2); background: var(--surface); box-shadow: var(--lift); }
  .pad-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .pad-tools { position: absolute; top: var(--s-2); right: var(--s-2); display: flex; gap: var(--s-2); }
  .pad-tools .icon-btn { background: var(--surface-2); box-shadow: none; }
  .pad-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); pointer-events: none; }

  const ding = () => { beep(988, 0.12, 0, 0.3, "triangle"); beep(1319, 0.3, 0.1, 0.3, "triangle"); };
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  let wakeLock = null;
  async function lockScreen() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch { wakeLock = null; } }
  function unlockScreen() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

  // ---------------------------------------------------------------- Timer
  let running = false, endAt = 0, raf = 0, endTimer = 0, lastSec = null;
  const RC = 2 * Math.PI * 146;
  const fmt = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function timerUI() {
    const t = state.turn; if (!t) return;
    const frac = Math.max(0, Math.min(1, t.remaining / (state.roundTime * 1000)));
    const s = Math.ceil(t.remaining / 1000);
    app.dataset.tphase = s <= 5 ? "crit" : s <= 15 ? "warn" : "ok";
    app.dataset.running = String(running);
    const timeEl = document.getElementById("time"); if (timeEl) timeEl.textContent = fmt(t.remaining);
    const bar = document.getElementById("rbar"); if (bar) bar.style.strokeDashoffset = RC * (1 - frac);
    const lin = document.getElementById("lin"); if (lin) lin.style.transform = "scaleX(" + frac + ")";
    const hint = document.getElementById("thint");
    if (hint) hint.textContent = running ? (hint.closest(".time-pill") ? "" : "Tippen pausiert") : "Pausiert";
  }
  function loop() {
    if (!running) return;
    state.turn.remaining = Math.max(0, endAt - performance.now());
    const s = Math.ceil(state.turn.remaining / 1000);
    if (s !== lastSec) {
      lastSec = s;
      if (s > 0 && s <= 10) tick(s);
      if (s === 10) buzz(80);
    }
    timerUI();
    if (state.turn.remaining <= 0) return timeUp();
    raf = requestAnimationFrame(loop);
  }
  function startTimer() {
    if (running || !state.turn) return;
    ensureAudio();
    endAt = performance.now() + state.turn.remaining;
    running = true; lastSec = Math.ceil(state.turn.remaining / 1000);
    clearTimeout(endTimer);
    endTimer = setTimeout(() => { if (running) { state.turn.remaining = 0; timeUp(); } }, state.turn.remaining + 60);
    lockScreen();
    raf = requestAnimationFrame(loop);
    timerUI();
  }
  function stopTimer() {
    if (running) state.turn.remaining = Math.max(0, endAt - performance.now());
    running = false;
    cancelAnimationFrame(raf); clearTimeout(endTimer);
    timerUI();
  }
  function togglePause() { running ? stopTimer() : startTimer(); save(); }

  // ---------------------------------------------------------------- Game flow
  const alternating = () => state.modeRule === "wechsel";
  const roundMode = (r) => MODE_KEYS[(r - 1) % MODE_KEYS.length];
  function newTurn() {
    state.turn = { mode: alternating() ? roundMode(state.round) : rand(MODE_KEYS), level: 2, word: null, open: false, revealed: false, swapped: false, remaining: state.roundTime * 1000, timeUp: false, lastOpen: false, results: [], before: state.teams.map((x) => x.score) };
    state.turn.open = state.openRounds && state.teams.length > 1 && Math.random() < OPEN_CHANCE;
    state.phase = "turn";
  }
  function pickWord(mode, level, avoid) {
    const list = WORDS[mode][level], key = mode + level;
    const used = (state.used[key] = Array.isArray(state.used[key]) ? state.used[key] : []);
    let pool = list.filter((w) => !used.includes(w) && w !== avoid);
    if (!pool.length) { used.length = 0; pool = list.filter((w) => w !== avoid); }
    const w = rand(pool);
    used.push(w);
    return w;
  }
  function score(idx) {
    const t = state.turn;
    state.teams[idx].score += t.level;
    t.results.push({ word: t.word, team: idx });
    ding(); buzz(60);
    if (state.teams[idx].score >= state.target) { state.winner = idx; return true; }
    return false;
  }
  function finishRound() {
    stopTimer(); unlockScreen();
    state.turn.lastOpen = false;
    state.phase = "result";
  }
  function nextWord(scoredBy) {
    const t = state.turn;
    const old = document.getElementById("wordcard") || document.getElementById("peek");
    const rect = old && old.getBoundingClientRect();
    t.word = pickWord(t.mode, t.level, t.word);
    strokes = [];
    render();
    const card = document.getElementById("wordcard") || document.getElementById("peek");
    if (card) { card.classList.add("deal", "fresh"); setTimeout(() => card.classList.remove("deal", "fresh"), 1400); }
    if (scoredBy !== undefined) popScore("+" + t.level, rect, t.open ? team(scoredBy).c : null);
  }
  function timeUp() {
    running = false; cancelAnimationFrame(raf); clearTimeout(endTimer);
    state.turn.remaining = 0; state.turn.timeUp = true; state.turn.lastOpen = true;
    unlockScreen(); alarm(); buzz([400, 150, 400, 150, 800]);
    state.phase = "result";
    render();
  }

  const actions = {
    // setup
    addTeam() { if (state.teams.length < 6) { const free = TEAMS.find((p) => !state.teams.some((t) => t.c === p.c)); state.teams.push({ ...free, score: 0 }); render(); } },
    removeTeam(i) { if (state.teams.length > 2) { state.teams.splice(Number(i), 1); render(); } },
    setTime(v) { state.roundTime = clampSetting("roundTime", v); render(); },
    setTarget(v) { state.target = clampSetting("target", v); render(); },
    step(arg) { const [k, d] = arg.split(":"); state[k] = clampSetting(k, state[k] + Number(d)); render(); },
    setupStep(v) { state.setupStep = Math.min(3, Math.max(1, Number(v) || 1)); render(); window.scrollTo(0, 0); },
    toggleOpen() { state.openRounds = !state.openRounds; render(); },
    start() {
      ensureAudio();
      state.teams.forEach((t, i) => { t.name = t.name.trim() || TEAMS.find((p) => p.c === t.c).name; t.score = 0; });
      state.current = 0; state.round = 1; state.turnsTaken = 0; state.winner = null;
      newTurn(); render(); window.scrollTo(0, 0);
    },
    // turn
    mode(m) { if (alternating()) return; state.turn.mode = m; render(); },
    setRule(v) { state.modeRule = v === "wechsel" ? "wechsel" : "frei"; render(); },
    roll() {
      if (alternating()) return;
      ensureAudio();
      const target = rand(MODE_KEYS);
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { state.turn.mode = target; return render(); }
      let i = MODE_KEYS.indexOf(state.turn.mode), n = 0; const steps = 8 + Math.floor(Math.random() * 3);
      const spin = () => {
        i = (i + 1) % 3; n++;
        state.turn.mode = n > steps ? target : MODE_KEYS[i];
        render(); beep(500 + i * 120, 0.04, 0, 0.1, "triangle");
        if (n <= steps) setTimeout(spin, 45 + n * 14);
      };
      spin();
    },
    level(l) { state.turn.level = Number(l); render(); },
    draw() {
      ensureAudio();
      state.turn.word = pickWord(state.turn.mode, state.turn.level);
      state.phase = "play"; strokes = [];
      startTimer(); render(); beep(660, 0.08, 0, 0.2);
    },
    // play
    pause() { togglePause(); },
    guessed(arg) {
      if (!running && state.turn.remaining <= 0) return;
      const idx = arg === undefined ? state.current : Number(arg);
      if (score(idx)) { finishRound(); render(); return; }
      nextWord(idx);
    },
    skip() {
      const t = state.turn;
      t.results.push({ word: t.word, team: null });
      beep(330, 0.08, 0, 0.15, "triangle");
      nextWord();
    },
    stopRound() { closeMenu(); resumeAfterMenu = false; finishRound(); render(); },
    // result
    last(arg) {
      const t = state.turn;
      if (arg === "none") t.results.push({ word: t.word, team: null });
      else score(Number(arg));
      t.lastOpen = false; render();
    },
    next() {
      if (state.winner !== null) { state.phase = "win"; fanfare(); render(); return; }
      state.turnsTaken++;
      state.current = (state.current + 1) % state.teams.length;
      if (state.current === 0) state.round++;
      newTurn(); render(); window.scrollTo(0, 0);
    },
    // win
    rematch() { state.teams.forEach((t) => (t.score = 0)); state.current = 0; state.round = 1; state.winner = null; newTurn(); render(); },
    newGame() { stopTimer(); resumeAfterMenu = false; const keep = { teams: state.teams.map((t) => ({ ...t, score: 0 })), roundTime: state.roundTime, target: state.target, openRounds: state.openRounds, sound: state.sound, used: state.used, modeRule: state.modeRule }; state = { ...fresh(), ...keep }; closeMenu(); render(); },
    // menu
    menu() { if (state.phase === "play" && running) { stopTimer(); resumeAfterMenu = true; } menuOpen = true; confirmEnd = false; sheetView = "menu"; renderMenu(); },
    rules() { if (state.phase === "play" && running) { stopTimer(); resumeAfterMenu = true; } menuOpen = true; confirmEnd = false; sheetView = "rules"; renderMenu(); sheet.querySelector(".sheet-body").scrollTop = 0; },
    closeMenu() { closeMenu(); if (resumeAfterMenu && state.phase === "play") startTimer(); resumeAfterMenu = false; },
    sound() { ensureAudio(); state.sound = !state.sound; renderMenu(); render(); },
    adj(arg) { const [i, d] = arg.split(":").map(Number); const t = state.teams[i]; t.score = Math.max(0, t.score + d); renderMenu(); if (state.phase !== "play") render(); else save(); },
    endGame() { if (!confirmEnd) { confirmEnd = true; renderMenu(); return; } actions.newGame(); },
    // drawing
    undo() { strokes.pop(); redraw(); },
    clear() { strokes = []; redraw(); }
  };
  function closeMenu() { menuOpen = false; confirmEnd = false; sheet.hidden = true; sheet.innerHTML = ""; }

  // ---------------------------------------------------------------- Views
  const timeLabel = () => state.roundTime >= 60 ? fmt(state.roundTime * 1000) + " min" : state.roundTime + " s";
  const pips = (n) => `<span class="pips" role="img" aria-label="${LEVELS[n]}">${[1, 2, 3].map((i) => `<i class="${i <= n ? "" : "off"}"></i>`).join("")}</span>`;
  const MARK = `<span class="mark" aria-hidden="true"><i class="m-erklaeren"></i><i class="m-zeichnen"></i><i class="m-pantomime"></i></span>`;
  const bar = (sub) => `<header class="bar"><div class="brand">${MARK}Dreierlei</div><div class="bar-sub">${sub}</div><button class="icon-btn" data-act="rules" aria-label="Spielregeln">${ICONS.book}</button><button class="icon-btn" data-act="menu" aria-label="Menü">${ICONS.menu}</button></header>`;
  const openBanner = () => `<div class="open-banner">${ICONS.all}<span><b>Offene Runde:</b> Alle Teams raten mit.</span></div>`;
  const ruleText = (m, l) => m !== "erklaeren" ? MODES[m].rule
    : "Mit Worten umschreiben. Das Wort selbst, Teile davon und Übersetzungen sind tabu." + (l > 1 ? ` Dazu stehen ${l === 2 ? 3 : 5} verbotene Wörter auf der Karte.` : "");
  const tabuFor = (tr) => (tr.mode === "erklaeren" && tr.level > 1 && TABU[tr.word]) || [];
  const cardFront = (tr) => {
    const tabu = tabuFor(tr);
    return `<span class="card-top">${ICONS[tr.mode]}<span>${MODES[tr.mode].name}</span>${pips(tr.level)}</span><span class="card-word fit">${esc(tr.word)}</span>${tabu.length ? `<span class="taboo"><span class="taboo-label">Nicht sagen</span><span class="taboo-list">${tabu.map((w) => `<span>${esc(w)}</span>`).join("")}</span></span>` : ""}<span class="card-bot">${ICONS[tr.mode]}<span>${MODES[tr.mode].name}</span></span>`;
  };
  const token = () => `<span class="token" aria-hidden="true"></span>`;

  // Board: one lane per team. With `from` (scores at turn start) the pawns walk to their new field.
  const board = (opts = {}) => {
    const list = state.teams.map((t, i) => ({ t, i }));
    if (opts.sorted) list.sort((a, b) => b.t.score - a.t.score);
    const pct = (v) => Math.min(100, (v / state.target) * 100).toFixed(2);
    return `<div class="board">${list.map(({ t, i }, rank) => {
      const before = opts.from && opts.from[i] !== undefined ? opts.from[i] : t.score;
      const gain = t.score - before;
      return `<div class="lane t-${t.c}${opts.current && i === state.current ? " current" : ""}">
        <div class="lane-top">${opts.sorted ? `<span class="place">${rank + 1}.</span>` : ""}${token()}<span class="name">${esc(t.name)}</span>${gain > 0 ? `<span class="gain">+${gain}</span>` : ""}<b>${t.score}</b><span class="of">/ ${state.target}</span></div>
        <div class="lane-track"><span class="lane-fill" data-to="${pct(t.score)}" style="width:${pct(before)}%"></span><span class="lane-pawn" data-to="${pct(t.score)}" style="left:${pct(before)}%">${ICONS.pawn}</span>${ICONS.flag}</div>
      </div>`;
    }).join("")}</div>`;
  };
  const stepper = (key, unit, step, act, presets) => `
    <div class="stepper">
      <button class="icon-btn" data-act="step" data-arg="${key}:-${step}" aria-label="Weniger">−</button>
      <label class="step-val"><input id="in-${key}" type="number" inputmode="numeric" data-setting="${key}" min="${LIMITS[key][0]}" max="${LIMITS[key][1]}" value="${state[key]}" aria-label="${unit}"><span>${unit}</span></label>
      <button class="icon-btn" data-act="step" data-arg="${key}:${step}" aria-label="Mehr">+</button>
    </div>
    <div class="presets">${presets.map((v) => `<button class="preset" data-act="${act}" data-arg="${v}" aria-pressed="${state[key] === v}">${v}</button>`).join("")}</div>`;

  const views = {
    setup() {
      const step = state.setupStep || 1;
      const top = `
      <div class="bar"><div class="brand">${MARK}Dreierlei</div><div class="grow"></div><button class="pill-btn" data-act="rules" aria-label="Spielregeln">${ICONS.book}<span>Spielregeln</span></button><button class="icon-btn" data-act="menu" aria-label="Einstellungen">${ICONS.gear}</button></div>
      <div class="steps" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${step}" aria-label="Schritt ${step} von 3">${[1, 2, 3].map((i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>`;
      const back = `<button class="btn btn-secondary" data-act="setupStep" data-arg="${step - 1}">Zurück</button>`;
      if (step === 1) {
        const dense = state.teams.length > 4;
        return `${top}
        <div class="intro"><p class="label">Schritt 1 von 3</p><h1 class="q">Wer spielt mit?</h1>${dense ? "" : `<p class="sub">Zwei bis sechs Teams. Tippe auf einen Namen, um ihn zu ändern.</p>`}</div>
        <div class="teams${dense ? " dense" : ""}">
          ${state.teams.map((t, i) => `
            <div class="team-row t-${t.c}">${token()}
              <input id="team-${t.c}" data-team="${i}" value="${esc(t.name)}" maxlength="24" aria-label="Name von Team ${i + 1}" autocomplete="off">
              ${state.teams.length > 2 ? `<button class="icon-btn" data-act="removeTeam" data-arg="${i}" aria-label="Team entfernen">${ICONS.close}</button>` : ""}
            </div>`).join("")}
          ${state.teams.length < 6 ? `<button class="add" data-act="addTeam">${ICONS.plus}Team hinzufügen</button>` : ""}
        </div>
        <div class="grow"></div>
        <div class="foot"><button class="btn btn-primary" data-act="setupStep" data-arg="2">Weiter${ICONS.skip}</button></div>`;
      }
      if (step === 2) {
        return `${top}
        <div class="intro"><p class="label">Schritt 2 von 3</p><h1 class="q">Wie wird gespielt?</h1></div>
        <div class="opts" role="radiogroup" aria-label="Spielmodus">
          <button class="opt" role="radio" id="rule-frei" aria-checked="${!alternating()}" data-act="setRule" data-arg="frei">${ICONS.shuffle}<span><b>Frei wählen</b><small>Jedes Team sucht sich die Darstellung aus oder würfelt.</small></span><i class="radio"></i></button>
          <button class="opt" role="radio" id="rule-wechsel" aria-checked="${alternating()}" data-act="setRule" data-arg="wechsel">${ICONS.repeat}<span><b>Immer abwechseln</b><small>Runde für Runde: Erklären, Zeichnen, Pantomime.</small></span><i class="radio"></i></button>
        </div>
        <button class="switch-row" id="openRounds" role="switch" aria-checked="${state.openRounds}" data-act="toggleOpen">
          <span><b>Offene Runden</b><small>Ab und zu dürfen alle Teams mitraten. Jede Karte zählt für das Team, das sie zuerst errät.</small></span>
          <span class="switch"></span>
        </button>
        <div class="grow"></div>
        <div class="foot row-even">${back}<button class="btn btn-primary" data-act="setupStep" data-arg="3">Weiter${ICONS.skip}</button></div>`;
      }
      return `${top}
        <div class="intro"><p class="label">Schritt 3 von 3</p><h1 class="q">Wie lange spielt ihr?</h1></div>
        <section class="group"><h2 class="label">Zeit pro Runde</h2>${stepper("roundTime", "Sekunden", 10, "setTime", [60, 90, 120, 180])}</section>
        <section class="group"><h2 class="label">Punkte zum Sieg</h2>${stepper("target", "Punkte", 5, "setTarget", [30, 50, 80, 100])}</section>
        <div class="grow"></div>
        <div class="foot row-even">${back}<button class="btn btn-primary" data-act="start">Los geht’s</button></div>`;
    },

    turn() {
      const t = team(), tr = state.turn, lock = alternating();
      const need = Math.max(0, state.target - t.score);
      return `
      ${bar("Runde " + state.round)}
      <div class="who t-${t.c}">
        <div class="who-text"><p class="label">Am Zug</p><h2>${esc(t.name)}</h2></div>
        <div class="need"><b>${need}</b><span>bis zum Ziel</span></div>
      </div>
      <section class="group">
        <div class="label-row"><h3 class="label">Darstellung</h3>${lock ? `<span class="lock">${ICONS.lock}Runde ${state.round} ist vorgegeben</span>` : ""}</div>
        <div class="modes${lock ? " locked" : ""}" role="radiogroup" aria-label="Darstellung">
          ${MODE_KEYS.map((m) => `<button class="mode m-${m}" role="radio" id="mode-${m}" aria-checked="${tr.mode === m}" ${lock ? "disabled" : `data-act="mode" data-arg="${m}"`}>${ICONS[m]}${MODES[m].name}</button>`).join("")}
          ${lock ? "" : `<button class="mode" data-act="roll" aria-label="Darstellung auswürfeln">${ICONS.dice}Würfeln</button>`}
        </div>
        <p class="hint-text">${lock ? `<b>Alle Teams ${MODES[tr.mode].verb}.</b> Nächste Runde: ${MODES[roundMode(state.round + 1)].name}. ` : ""}${ruleText(tr.mode, tr.level)}</p>
      </section>
      <section class="group">
        <h3 class="label">Schwierigkeit</h3>
        <div class="levels" role="radiogroup" aria-label="Schwierigkeit">
          ${[1, 2, 3].map((l) => `<button class="level" role="radio" id="level-${l}" aria-checked="${tr.level === l}" data-act="level" data-arg="${l}">${pips(l)}<b>${LEVELS[l]}</b><small>${pts(l)}</small></button>`).join("")}
        </div>
      </section>
      ${tr.open ? openBanner() : ""}
      <div class="grow"></div>
      <div class="foot"><p class="handoff-hint">${ICONS.phone}Handy an die Person geben, die darstellt</p><button class="btn btn-primary" data-act="draw">Karte ziehen · ${timeLabel()}</button></div>`;
    },

    play() {
      const t = team(), tr = state.turn, m = MODES[tr.mode];
      const menuBtn = `<button class="icon-btn" data-act="menu" aria-label="Menü">${ICONS.menu}</button>`;
      const timePill = `<button class="time-pill" data-act="pause" aria-label="Pause oder weiter"><span class="time" id="time">${fmt(tr.remaining)}</span><span class="thint" id="thint"></span></button>`;
      const head = `<div class="playhead"><span class="chip-team t-${t.c}">${token()}<span>${esc(t.name)}</span></span><span class="chip-mode m-${tr.mode}">${ICONS[tr.mode]}${m.name}${pips(tr.level)}</span><span class="grow"></span>${menuBtn}</div>`;
      const flip = (slim) => `<button class="flip m-${tr.mode}${slim ? " slim" : " play-card"}" id="peek" aria-label="Gedrückt halten, um den Begriff zu sehen"><span class="flip-inner"><span class="card face-back"><span class="back-icon">${ICONS[tr.mode]}</span><span class="back-hint">${ICONS.eye}Zum Ansehen gedrückt halten</span></span><span class="card face-front">${cardFront(tr)}</span></span></button>`;
      const got = tr.results.filter((r) => r.team !== null).length;
      const tally = `<p class="tally">${got ? `${ICONS.check}${got} erraten · +${got * tr.level} Punkte` : `So viele Karten wie möglich · ${pts(tr.level)} je Karte`}</p>`;
      const btns = tally + (tr.open
        ? `<div class="openpick"><p class="label">Erraten hat</p><div class="pick3">${state.teams.map((x, i) => `<button class="btn btn-team t-${x.c}" data-act="guessed" data-arg="${i}"><span>${esc(x.name)}</span></button>`).join("")}</div><button class="btn btn-secondary" data-act="skip">Überspringen</button></div>`
        : `<div class="row"><button class="btn btn-secondary" data-act="skip">Überspringen</button><button class="btn btn-ok" data-act="guessed">${ICONS.check}Erraten!</button></div>`);
      if (tr.mode === "zeichnen") {
        return `
        ${head}
        <div class="draw-timer"><div class="lin m-${tr.mode}"><span id="lin"></span></div>${timePill}</div>
        <div class="pad-wrap">
          <canvas id="pad"></canvas>
          <div class="pad-empty" id="padempty">Hier zeichnen</div>
          <div class="pad-tools">
            <button class="icon-btn" data-act="undo" aria-label="Rückgängig">${ICONS.undo}</button>
            <button class="icon-btn" data-act="clear" aria-label="Alles löschen">${ICONS.trash}</button>
          </div>
        </div>
        ${flip(true)}${btns}`;
      }
      return `
      ${head}
      <button class="clock" data-act="pause" aria-label="Pause oder weiter"><span class="time" id="time">${fmt(tr.remaining)}</span><span class="thint" id="thint"></span></button>
      <div class="lin m-${tr.mode}"><span id="lin"></span></div>
      ${tr.mode === "erklaeren" ? `<div class="card play-card m-${tr.mode}" id="wordcard">${cardFront(tr)}</div>` : flip(false)}
      ${btns}`;
    },

    result() {
      const t = team(), tr = state.turn, lv = tr.level;
      const got = tr.results.filter((r) => r.team !== null);
      const chips = tr.results.length ? `<section class="group"><h3 class="label">Karten dieser Runde</h3><ul class="words">${tr.results.map((r) => r.team === null
        ? `<li class="miss">${ICONS.x}<span>${esc(r.word)}</span></li>`
        : `<li class="hit t-${team(r.team).c}">${tr.open ? token() : ICONS.check}<span>${esc(r.word)}</span><b>+${lv}</b></li>`).join("")}</ul></section>` : "";
      if (tr.lastOpen) {
        const answer = tr.open
          ? `<div class="pick">${state.teams.map((x, i) => `<button class="btn btn-team t-${x.c}" data-act="last" data-arg="${i}"><span>${esc(x.name)}</span></button>`).join("")}<button class="btn btn-secondary" data-act="last" data-arg="none">Niemand</button></div>`
          : `<div class="row-even"><button class="btn btn-secondary" data-act="last" data-arg="none">Nein</button><button class="btn btn-ok" data-act="last" data-arg="${state.current}">${ICONS.check}Ja, erraten</button></div>`;
        return `
        ${bar(esc(t.name))}
        <div class="timeup"><p class="label">${ICONS.clock}Zeit um</p><h2>${tr.open ? "Hat ein Team diese Karte noch rechtzeitig erraten?" : "Wurde diese Karte noch rechtzeitig erraten?"}</h2></div>
        <div class="card small m-${tr.mode}">${cardFront(tr)}</div>
        ${chips}
        <div class="grow"></div>
        <div class="foot">${answer}</div>`;
      }
      let hero;
      if (state.winner !== null) {
        const w = team(state.winner);
        hero = `<div class="summary champ t-${w.c}"><p class="label">Ziel erreicht</p><p class="big fit">${esc(w.name)}</p><p class="sub">hat ${w.score} Punkte</p></div>`;
      } else if (tr.open) {
        hero = `<div class="summary${got.length ? " good" : ""}"><p class="label">${tr.timeUp ? "Zeit um" : "Runde beendet"} · offene Runde</p><p class="big">${got.length}</p><p class="sub">${got.length === 1 ? "Karte" : "Karten"} erraten</p></div>`;
      } else {
        hero = `<div class="summary${got.length ? " good" : ""}"><p class="label">${tr.timeUp ? "Zeit um" : "Runde beendet"}</p><p class="big">+${got.length * lv}</p><p class="sub">${got.length ? `${got.length} ${got.length === 1 ? "Karte" : "Karten"} erraten · ${esc(t.name)}` : "Keine Karte erraten"}</p></div>`;
      }
      const nextTeam = team((state.current + 1) % state.teams.length);
      return `
      ${bar(esc(t.name))}
      ${hero}
      ${chips}
      <section class="group"><h3 class="label">Spielfeld</h3>${board({ from: tr.before, current: true })}</section>
      <div class="grow"></div>
      <div class="foot sticky">${state.winner !== null
        ? `<button class="btn btn-primary" data-act="next">${ICONS.trophy}Zur Siegerehrung</button>`
        : `<button class="btn btn-primary" data-act="next"><span>Weiter: ${esc(nextTeam.name)}</span>${ICONS.skip}</button>`}</div>`;
    },

    win() {
      const w = team(state.winner);
      return `
      ${bar("Spielende")}
      <div class="winner t-${w.c}"><canvas id="confetti" aria-hidden="true"></canvas>
        <span class="cup">${ICONS.trophy}</span>
        <p class="label">Gewonnen</p><h1 class="fit">${esc(w.name)}</h1><p>${w.score} Punkte nach ${state.round} ${state.round === 1 ? "Runde" : "Runden"}</p>
      </div>
      <section class="group"><h3 class="label">Endstand</h3>${board({ sorted: true })}</section>
      <div class="grow"></div>
      <div class="foot row-even"><button class="btn btn-secondary" data-act="newGame">Neues Spiel</button><button class="btn btn-primary" data-act="rematch">Revanche</button></div>`;
    }
  };

  function rulesView() {
    const time = state.roundTime >= 60 ? fmt(state.roundTime * 1000) + " Minuten" : state.roundTime + " Sekunden";
    return `
      <div class="sheet-body rules-sheet" role="dialog" aria-label="Spielregeln">
        <div class="bar"><h2 class="grow">Spielregeln</h2><button class="icon-btn" data-act="closeMenu" aria-label="Schließen">${ICONS.close}</button></div>
        <section><h3>Ziel</h3>
          <p>Die Teams erraten Begriffe, die eine Person aus dem eigenen Team <b>erklärt</b>, <b>zeichnet</b> oder als <b>Pantomime</b> vorspielt. Das erste Team mit ${state.target} Punkten gewinnt sofort.</p>
        </section>
        <section><h3>Ein Zug</h3>
          <ol class="rule-list">
            <li>Das Team am Zug wählt die Darstellung (oder würfelt) und die Schwierigkeit. Im Modus <b>Immer abwechseln</b> ist die Darstellung vorgegeben.</li>
            <li>Eine Person aus dem Team nimmt das Handy und tippt auf <b>Karte ziehen</b>. Die erste Karte erscheint, die Zeit läuft (${time}).</li>
            <li>Das eigene Team rät so viele Karten wie möglich. <b>Erraten!</b> gibt die Punkte und zieht sofort die nächste Karte. <b>Überspringen</b> kostet keine Punkte, nur Zeit.</li>
            <li>Ist die Zeit um, zählt die letzte Karte nur, wenn sie noch rechtzeitig erraten wurde. Dann ist das nächste Team dran, am besten mit einer anderen Person.</li>
          </ol>
        </section>
        <section><h3>Die drei Darstellungen</h3>
          <div class="rule-modes">
            ${MODE_KEYS.map((m) => `<div class="rule-mode"><span class="rm-icon m-${m}">${ICONS[m]}</span><div><b>${MODES[m].name}</b><p>${MODES[m].rule} ${m === "erklaeren" ? "Die Karte liegt offen auf dem Bildschirm." : "Die Karte liegt verdeckt. Wer sie gedrückt hält, sieht den Begriff."}</p></div></div>`).join("")}
          </div>
        </section>
        <section><h3>Schwierigkeit und Punkte</h3>
          <p>Jede Karte zählt <b>1 Punkt</b> (leicht), <b>2 Punkte</b> (mittel) oder <b>3 Punkte</b> (schwer). Für jede Darstellung gibt es eigene Begriffe: Leicht ist sofort erkennbar, mittel braucht mehrere Schritte, schwer sind abstrakte Begriffe, Märchen, Filme und Redewendungen.</p>
          <p>Beim <b>Erklären</b> stehen auf mittleren Karten <b>3</b> und auf schweren Karten <b>5</b> Wörter, die nicht fallen dürfen. Rutscht eins heraus, ist die Karte verloren: einfach <b>Überspringen</b> tippen.</p>
        </section>
        <section><h3>Spielmodi</h3>
          <p><b>Frei wählen:</b> Jedes Team sucht sich die Darstellung vor seinem Zug aus oder würfelt.</p>
          <p><b>Immer abwechseln:</b> Runde 1 wird erklärt, Runde 2 gezeichnet, Runde 3 pantomimisch gespielt, danach geht es von vorn los. In jeder Runde ist jedes Team einmal dran.</p>
        </section>
        <section><h3>Offene Runden</h3>
          <p>Ist die Einstellung an, dürfen etwa in jedem sechsten Zug alle Teams mitraten. Statt „Erraten!“ gibt es dann einen Knopf pro Team: Wer eine Karte zuerst errät, bekommt die Punkte.</p>
        </section>
        <section><h3>Gut zu wissen</h3>
          <p>Ein Tipp auf den Timer pausiert die Runde. Im Menü lassen sich Punkte korrigieren und Runden vorzeitig beenden. Der Spielstand bleibt erhalten, auch wenn die Seite neu geladen wird.</p>
        </section>
        <button class="btn btn-primary" data-act="closeMenu">${state.phase === "play" ? "Weiterspielen" : "Verstanden"}</button>
      </div>`;
  }

  function renderMenu() {
    if (!menuOpen) return;
    if (sheetView === "rules") { sheet.innerHTML = rulesView(); sheet.hidden = false; return; }
    const inGame = state.phase !== "setup";
    sheet.innerHTML = `
      <div class="sheet-body" role="dialog" aria-label="Menü">
        <div class="bar"><h2 class="grow">${inGame ? "Menü" : "Einstellungen"}</h2><button class="icon-btn" data-act="closeMenu" aria-label="Schließen">${ICONS.close}</button></div>
        <button class="switch-row" role="switch" aria-checked="${state.sound}" data-act="sound">
          <span><b>Ton</b><small>Ticken in den letzten 10 Sekunden und Alarm bei Zeitende.</small></span><span class="switch"></span>
        </button>
        ${inGame ? `
        <section class="panel"><h3 class="label">Punkte korrigieren</h3>
          ${state.teams.map((t, i) => `
            <div class="adj t-${t.c}">${token()}<span class="name">${esc(t.name)}</span>
              <button class="icon-btn" data-act="adj" data-arg="${i}:-1" aria-label="Minus">−</button><b>${t.score}</b><button class="icon-btn" data-act="adj" data-arg="${i}:1" aria-label="Plus">+</button>
            </div>`).join("")}
        </section>
        <button class="btn btn-secondary" data-act="rules">${ICONS.book}Spielregeln</button>
        ${state.phase === "play" ? `<button class="btn btn-secondary" data-act="stopRound">Runde jetzt beenden</button>` : ""}
        <button class="btn btn-secondary${confirmEnd ? " danger" : ""}" data-act="endGame">${confirmEnd ? "Wirklich beenden? Nochmal tippen" : "Spiel beenden"}</button>` : ""}
        <button class="btn btn-primary" data-act="closeMenu">${state.phase === "play" ? "Weiterspielen" : "Schließen"}</button>
      </div>`;
    sheet.hidden = false;
  }

  // Shrink a word until it fits the card: at most two lines, no single word wider than the card.
  function fitText(root = app) {
    root.querySelectorAll(".fit").forEach((el) => {
      el.style.fontSize = "";
      let size = parseFloat(getComputedStyle(el).fontSize);
      const lineH = () => parseFloat(getComputedStyle(el).lineHeight) || size * 1.05;
      const card = el.closest(".card");
      const tooBig = () => el.scrollWidth > el.clientWidth + 1 || el.offsetHeight > lineH() * 2 + 2 || (card && card.scrollHeight > card.clientHeight + 1);
      while (tooBig() && size > 20) { size -= 2; el.style.fontSize = size + "px"; }
      if (tooBig()) el.style.overflowWrap = "anywhere";
    });
  }
  function walkPawns() {
    const els = app.querySelectorAll("[data-to]"); if (!els.length) return;
    requestAnimationFrame(() => requestAnimationFrame(() => els.forEach((el) => {
      const v = el.dataset.to + "%";
      if (el.classList.contains("lane-fill")) el.style.width = v; else el.style.left = v;
    })));
  }
  function popScore(text, rect, teamC) {
    if (!rect || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const el = document.createElement("div");
    el.className = "pop" + (teamC ? " by-team t-" + teamC : "");
    el.textContent = text;
    el.style.left = rect.left + rect.width / 2 + "px";
    el.style.top = rect.top + rect.height / 2 + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  function render() {
    app.className = "screen phase-" + state.phase;
    app.innerHTML = views[state.phase]();
    if (state.phase === "play") { timerUI(); bindPeek(); if (state.turn.mode === "zeichnen") setupPad(); }
    if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => fitText());
    fitText();
    walkPawns();
    if (state.phase === "win") confetti();
    save();
  }

  // ---------------------------------------------------------------- Events
  function onAct(e) {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const fn = actions[b.dataset.act]; if (fn) fn(b.dataset.arg, b);
  }
  app.addEventListener("click", onAct);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) { actions.closeMenu(); return; } onAct(e); });
  app.addEventListener("change", (e) => {
    const k = e.target.dataset.setting; if (!k) return;
    state[k] = clampSetting(k, e.target.value); render();
  });
  app.addEventListener("input", (e) => {
    const k = e.target.dataset.setting;
    if (k) { const n = Number(e.target.value); if (e.target.value !== "" && n >= LIMITS[k][0] && n <= LIMITS[k][1]) { state[k] = Math.round(n); save(); } return; }
    const i = e.target.dataset.team; if (i === undefined) return;
    state.teams[Number(i)].name = e.target.value; save();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && menuOpen) actions.closeMenu();
    if (e.code === "Space" && state.phase === "play" && e.target === document.body) { e.preventDefault(); togglePause(); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) { lockScreen(); loop(); }
    if (document.visibilityState === "hidden") save();
  });

  function bindPeek() {
    const p = document.getElementById("peek"); if (!p) return;
    const on = (e) => { e.preventDefault(); p.classList.add("on"); };
    const off = () => { p.classList.remove("on"); };
    p.addEventListener("pointerdown", on);
    ["pointerup", "pointerleave", "pointercancel", "blur"].forEach((ev) => p.addEventListener(ev, off));
    p.addEventListener("contextmenu", (e) => e.preventDefault());
    p.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") on(e); });
    p.addEventListener("keyup", off);
  }

  // ---------------------------------------------------------------- Drawing pad
  let strokes = [], pad = null, ctx = null, drawing = null;
  function setupPad() {
    pad = document.getElementById("pad"); if (!pad) return;
    ctx = pad.getContext("2d");
    const size = () => {
      const r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    };
    size();
    new ResizeObserver(size).observe(pad);
    const pos = (e) => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
    pad.addEventListener("pointerdown", (e) => { pad.setPointerCapture(e.pointerId); drawing = [pos(e)]; strokes.push(drawing); redraw(); });
    pad.addEventListener("pointermove", (e) => { if (!drawing) return; (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach((ev) => drawing.push(pos(ev))); redraw(); });
    ["pointerup", "pointercancel"].forEach((ev) => pad.addEventListener(ev, () => { drawing = null; }));
  }
  function redraw() {
    if (!pad || !ctx) return;
    const r = pad.getBoundingClientRect(), W = r.width, H = r.height;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#141A2E";
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of strokes) {
      if (s.length === 1) { ctx.beginPath(); ctx.arc(s[0][0] * W, s[0][1] * H, 2.5, 0, Math.PI * 2); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(s[0][0] * W, s[0][1] * H);
      for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0] * W, s[i][1] * H);
      ctx.stroke();
    }
    const empty = document.getElementById("padempty"); if (empty) empty.hidden = strokes.length > 0;
  }

  // ---------------------------------------------------------------- Confetti (win screen)
  function confetti() {
    const c = document.getElementById("confetti"); if (!c) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const g = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    const r = c.getBoundingClientRect(); c.width = r.width * dpr; c.height = r.height * dpr; g.scale(dpr, dpr);
    const cols = ["#FFFFFF", "rgba(255,255,255,.55)", "#FFD866", "#FFB199", "#B8F0D8"];
    const bits = Array.from({ length: 70 }, () => ({ x: Math.random() * r.width, y: -Math.random() * r.height, vy: 1 + Math.random() * 2.2, vx: -0.6 + Math.random() * 1.2, s: 4 + Math.random() * 5, a: Math.random() * 6, col: rand(cols) }));
    let frames = 0;
    (function step() {
      if (!document.body.contains(c)) return;
      g.clearRect(0, 0, r.width, r.height);
      bits.forEach((b) => { b.y += b.vy; b.x += b.vx; b.a += 0.1; g.save(); g.translate(b.x, b.y); g.rotate(b.a); g.fillStyle = b.col; g.globalAlpha = .85; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g.restore(); });
      if (++frames < 260) requestAnimationFrame(step); else g.clearRect(0, 0, r.width, r.height);
    })();
  }

  // ---------------------------------------------------------------- Boot
  function boot(data) {
    load(data);
    if (state.phase !== "setup" && !state.turn) newTurn();
    if (state.turn && !Array.isArray(state.turn.results)) { state.turn.results = []; state.turn.lastOpen = false; }
    if (state.phase === "win" && state.winner === null) state.phase = "setup";
    if (state.phase === "reveal") state.phase = "turn";
    running = false;   // a restored round starts paused
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ state: snapshot() }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
